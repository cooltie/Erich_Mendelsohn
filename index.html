<!doctype html>

  <style>
/* Engine base styles. Corner rounding is up to each exhibition's design. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
body { font-family: var(--font); -webkit-font-smoothing: antialiased; color: #fff; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; } /* manipulation: quick taps never zoom the page */

#root, .stage { position: fixed; inset: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow: hidden; }
.screen[hidden] { display: none; }

.el { position: absolute; }
.el .inner { position: relative; width: 100%; }

/* hover effects (IDs listed in effects.js `hovers`) */
.hover-lift, .hover-lift .card { transition: transform .5s cubic-bezier(.16,1,.3,1); }
.hover-lift .card:hover, .hover-lift.el:hover .inner { transform: translateY(-8px); }
.hover-zoom .card:hover img, .hover-zoom:hover img { transform: scale(1.05); }

  content: ""; position: absolute; left: 0; right: 0; bottom: -.15em; height: 1px; background: currentColor;
  transform: scaleX(0); transform-origin: left; transition: transform .5s cubic-bezier(.16,1,.3,1);
}
.hover-underline .card:hover .card-label::after, .hover-underline:hover .para::after { transform: scaleX(1); }
.hover-underline .para { position: relative; display: inline-block; }
.hover-dim .cards .card, .hover-dim .inner > .card { transition: opacity .4s ease; }
.hover-dim .inner:hover > .card { opacity: .35; }

/* chrome */
.chrome { position: fixed; inset: 0; pointer-events: none; z-index: 50; font-size: 13px; letter-spacing: .06em; }
.lang { position: absolute; top: 24px; right: 28px; display: flex; pointer-events: auto; border: 1px solid rgba(255,255,255,.5); background: #000; }

.lang-b.on { background: #fff; color: #000; }

.ticks.hidden { opacity: 0; pointer-events: none; }
.tick { position: relative; width: 12px; height: 12px; border: 1px solid var(--chrome-fg, #fff); opacity: .8; transition: background-color .9s ease, border-color .9s ease; }
.tick::after { content: ""; position: absolute; inset: -8px -10px; } /* bigger hover / click area */
.tick.on { background: var(--chrome-fg, #fff); opacity: 1; }
.tick:focus:not(:focus-visible) { outline: none; } /* no focus ring after a mouse click */
/* ex.nav labels, left of the squares: while the menu is hovered, only the current item and the hovered one */
.tick-label { position: absolute; right: 18px; top: 50%; transform: translate(6px, -50%); white-space: nowrap; line-height: 1;
  font-size: 17px; letter-spacing: .02em; color: var(--chrome-fg, #fff); background: var(--chrome-bg, #000); padding: 5px 8px; opacity: 0; pointer-events: none;
  transition: opacity .35s ease, transform .5s cubic-bezier(.16,1,.3,1), color .25s; }
.ticks:hover .tick.on .tick-label, .ticks .tick:hover .tick-label { opacity: 1; transform: translate(0, -50%); }
.ticks .tick:hover .tick-label { opacity: 1; }

/* cursor-square (theme.cursor: "square"): a square that inverts what is under it */
.has-cursor-square, .has-cursor-square * { cursor: none !important; }
.cursor-square { position: fixed; left: 0; top: 0; z-index: 100; width: 14px; height: 14px; margin: -7px 0 0 -7px; background: #fff;
  mix-blend-mode: difference; pointer-events: none; opacity: 0; transition: opacity .2s, width .25s, height .25s, margin .25s; }
.cursor-square.on { opacity: 1; }
.cursor-square.over-link { width: 22px; height: 22px; margin: -11px 0 0 -11px; }

/* walkthrough (type walkthrough): horizontal walk through the rooms, driven by vertical scrolling */
.el-walkthrough { left: 0; top: 0; width: 100vw; }
.wt-stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
.wt-strip { position: relative; display: flex; height: 100vh; width: max-content; will-change: transform; }

.wt-photo img { position: absolute; top: 0; height: 100%; object-fit: cover; will-change: transform; }
.wt-text { position: relative; flex: none; align-self: flex-start; overflow-y: auto; overscroll-behavior: auto; scrollbar-width: none; will-change: opacity; }
.wt-text::-webkit-scrollbar { display: none; }
.wt-text.more { -webkit-mask-image: linear-gradient(#000 calc(100% - 10vh), transparent); mask-image: linear-gradient(#000 calc(100% - 10vh), transparent); }
.wt-text.scrolled { -webkit-mask-image: linear-gradient(transparent 6vh, #000 12vh); mask-image: linear-gradient(transparent 6vh, #000 12vh); }
.wt-text.more.scrolled { -webkit-mask-image: linear-gradient(transparent 6vh, #000 12vh, #000 calc(100% - 10vh), transparent); mask-image: linear-gradient(transparent 6vh, #000 12vh, #000 calc(100% - 10vh), transparent); }
.wt-text .para { margin: 0; }
.wt-text .para.indent { text-indent: 2.4em; }
.wt-text em { font-style: italic; }
.wt-artist { display: inline-block; margin-bottom: 3vh; position: relative; }
.wt-text .wt-medium { margin-bottom: 3.5vh; }
.wt-credits { margin-top: 3.5vh; }
.wt-hud { position: absolute; left: 7vw; bottom: 6vh; z-index: 3; width: 22vw; }
.wt-labels { position: relative; height: 1.5em; margin-bottom: 10px; }

.wt-bar { height: 1px; background: rgba(255,255,255,.25); }
.wt-bar-fill { height: 100%; background: #fff; transform-origin: 0 0; transform: scaleX(0); }
.id-label { position: absolute; left: 14px; top: 12px; display: none; background: #fff; color: #000; padding: 3px 7px; font-size: 12px; letter-spacing: 0; }

/* debug: press D */
body.debug .id-label { display: block; }
body.debug .el { outline: 1px dashed #ff3b6b; }
body.debug .el::before, body.debug .card::before {
  content: attr(data-id); position: absolute; left: 0; top: 0; z-index: 99; transform: translateY(-100%);
  background: #ff3b6b; color: #fff; font: 11px/1 monospace; padding: 2px 4px; white-space: nowrap; pointer-events: none;
}
.card { outline-offset: 0; }
body.debug .card { outline: 1px dotted #ff3b6b; }

/* slot: placeholder for a future image, visible only in debug (D) */
.slot { visibility: hidden; }
body.debug .slot { visibility: visible; outline: 1px dashed rgba(255,255,255,.5); }
body.debug .slot .inner { display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.5); font: 12px/1.3 monospace; text-align: center; padding: 8px; }

/* list with hover preview */
.list-item { width: max-content; max-width: 100%; transition: opacity .35s ease, transform .5s cubic-bezier(.16,1,.3,1); }
.el-list .inner:hover > .list-item { opacity: .35; }
.el-list .inner > .list-item:hover { opacity: 1; transform: translateX(1.2vw); }
.list-preview { position: absolute; z-index: 4; pointer-events: none; overflow: hidden; clip-path: inset(0 0 100% 0); transition: clip-path .6s cubic-bezier(.16,1,.3,1); }
.list-preview.on { clip-path: inset(0 0 0 0); }
.list-preview img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* scrollable screen (def.scroll) */
.screen.scrollable { overflow-y: auto; overflow-x: hidden; scrollbar-width: none; overscroll-behavior: none; }
.screen.scrollable::-webkit-scrollbar { display: none; }

/* pin: sticky layer, see Engine.pinHost */
.pin-track { position: absolute; left: 0; width: 100%; z-index: 2; pointer-events: none; }
.pin-layer { position: sticky; top: 0; height: 100vh; width: 100%; }
.pin-layer > .el { pointer-events: auto; }
.pin-layer > .el-blobzoom, .el-blobzoom { pointer-events: none; }

/* blob-zoom layers (see Engine.build_blobzoom) */
.bz-win { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.bz-img { position: absolute; display: block; object-fit: cover; transform-origin: 0 0; will-change: transform; }

/* info-bubble (ex.info): swaying circle of texture with "i", bottom right; circle-open: it grows over the screen */
.info-bubble { position: absolute; right: 26px; bottom: 26px; width: 64px; height: 64px; pointer-events: auto; overflow: hidden;
  clip-path: circle(50%); animation: info-sway 6s ease-in-out infinite; }
.info-bubble[hidden] { display: none; }
.info-bubble { transition: opacity .8s ease; }
.info-bubble.during-scene { opacity: 0; pointer-events: none; }
.info-tex { position: absolute; inset: -14%; background-size: cover; background-position: center; animation: info-drift 9s ease-in-out infinite;
  transition: scale .6s cubic-bezier(.16,1,.3,1); }
.info-bubble:hover .info-tex { scale: 1.18; }
.info-i { position: relative; display: flex; align-items: center; justify-content: center; height: 100%;
  font: 500 28px/1 var(--font); color: #000; }
@keyframes info-sway { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-5px) rotate(6deg); } }
@keyframes info-drift { 0%, 100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(-14deg) scale(1.08); } }
.info-open { position: fixed; inset: 0; z-index: 90; background-size: cover; background-position: center; pointer-events: none; }

/* line (type line): SVG drawing */
.el-line svg { display: block; width: 100%; height: 100%; overflow: visible; }

/* button / buttons: pill (solid) or underlined link; --btn-c is the colour */
.btn { display: inline-flex; align-items: center; gap: .55em; cursor: pointer; user-select: none; white-space: nowrap; text-decoration: none; }
.btn-solid { padding: .62em 1.45em .68em; border-radius: 999px; border: 1.5px solid var(--btn-c); background: var(--btn-c); color: var(--c-paper, #fff); transition: background-color .35s ease, color .35s ease; }
.btn-solid:hover, .btn-solid:focus-visible { background: transparent; color: var(--btn-c); }
.btn-link { color: var(--btn-c); padding: .62em 0 .5em; background: linear-gradient(currentColor, currentColor) 0 calc(100% - .32em) / 100% 1.5px no-repeat; transition: background-size .45s cubic-bezier(.16,1,.3,1); }
.btn-link:hover, .btn-link:focus-visible { background-size: 0% 1.5px; background-position: 100% calc(100% - .32em); }
.btn-arrow { display: inline-block; transition: transform .4s cubic-bezier(.16,1,.3,1); }
.btn:hover .btn-arrow { transform: translateX(.25em); }
.btn:focus:not(:focus-visible) { outline: none; }
.btn .btn-label { color: inherit; }

/* counter */
.counter-num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.counter-line { display: block; width: 100%; height: 8px; margin: .5em 0 .8em; overflow: visible; }
.counter-label { margin: 0; }

/* line-across: transition line over everything */
.line-across { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 60; pointer-events: none; overflow: visible; }

/* sound toggle (type sound) */
.sound-toggle .inner { display: flex; align-items: center; gap: .6em; }
.sound-mark { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; transition: background-color .3s; }
.sound-toggle.on .sound-mark { background: var(--c-accent, currentColor); border-color: var(--c-accent, currentColor); }
.sound-toggle .sound-label { color: inherit; }
.sound-toggle:focus:not(:focus-visible) { outline: none; }

/* image credit (image.credit): "i" at the bottom-right corner, opens the caption */
.credit-i { position: absolute; right: 10px; bottom: 10px; z-index: 3; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--c-ink, currentColor); color: var(--c-ink, currentColor); background: var(--c-paper, #fff);
  font: 500 14px/1 var(--font); display: flex; align-items: center; justify-content: center; transition: background-color .3s, color .3s, border-color .3s; }
.credit-i:hover, .credit-i.on { background: var(--c-ink, #000); color: var(--c-paper, #fff); }
.credit-i:focus:not(:focus-visible) { outline: none; }
.credit-panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 100%; overflow-y: auto; z-index: 2; padding: 14px 46px 14px 16px; scrollbar-width: thin;
  background: var(--c-paper, #fff); border: 1.5px solid var(--c-ink, #000); }
.credit-panel[hidden] { display: none; }
.credit-line { margin: 0; }
.credit-line + .credit-line { margin-top: .5em; }

/* narrow screens: menu squares hidden (swipe to move), so they never sit on top of the text */
@media (max-width: 700px) { .ticks { display: none; } }

/* route (type route) */
.route .inner { position: relative; }
.route svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.route-stop { position: absolute; width: 0; height: 0; }
.route-dot { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--c-paper, #fff); border: 2px solid var(--c-ink, #000); }
.route-stop.rupture .route-dot { border-color: var(--c-accent, red); }
.route-stop.current .route-dot { background: var(--c-accent, red); border-color: var(--c-accent, red); width: 16px; height: 16px; left: -8px; top: -8px; }
.route-label { position: absolute; white-space: nowrap; }
.route-label p { margin: 0; }
.route-note { margin-top: .3em !important; }
.side-above .route-label { left: -6px; bottom: 18px; }
.side-below .route-label { left: -6px; top: 18px; }
.side-right .route-label { left: 18px; top: 50%; transform: translateY(-50%); }
.side-left .route-label { right: 18px; top: 50%; transform: translateY(-50%); text-align: right; }
.route-end { position: absolute; margin: 0; white-space: nowrap; transform: translate(12px, -50%); }
.route-tick { position: absolute; white-space: nowrap; }

/* theme.grid: column lines under every screen */
.grid-bg { position: absolute; top: 0; bottom: 0; display: grid; pointer-events: none; z-index: 0; }
.grid-bg > div { border-left: 1px solid var(--chrome-fg, #000); border-right: 1px solid var(--chrome-fg, #000); opacity: var(--grid-o, .08); transition: border-color .9s ease; }
.screen { z-index: 1; }

/* image caption (image.caption) */
.img-caption { position: absolute; left: 0; top: 100%; margin: .7em 0 0; max-width: 100%; }
.img-circle { aspect-ratio: 1; }
.img-circle .inner { height: 100%; }
.img-circle img { border-radius: 50%; }

/* lightbox (theme.zoom / image.zoom) */
img.zoomable { cursor: zoom-in; }
.lb { position: fixed; inset: 0; z-index: 95; touch-action: none; display: flex; flex-direction: column; background: var(--c-paper, #fff); color: var(--c-ink, #000); }
.lb-stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4vh 4vw 0; touch-action: none; cursor: zoom-out; }
.lb-img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: 50% 50%; user-select: none; cursor: zoom-in; will-change: transform; }
.lb.zoomed .lb-img { cursor: grab; }
.lb.zoomed .lb-img:active { cursor: grabbing; }
.lb-bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 2vw; padding: 2vh 4vw 3vh; padding-bottom: calc(3vh + env(safe-area-inset-bottom, 0px)); }
.lb-info { min-width: 0; max-width: 72ch; }
.lb-text { margin: 0 0 .8em; }
.lb-text[hidden] { display: none; }
.lb-caption, .lb-credit-line { margin: 0; }
.lb-credit { margin-top: .5em; display: flex; flex-wrap: wrap; column-gap: 1.2em; }
.lb-controls { display: flex; align-items: center; gap: 8px; flex: none; }
.lb-btn { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 2px solid var(--c-ink, #000); display: flex; align-items: center; justify-content: center; padding: 0; transition: background-color .25s, color .25s; }
.lb-btn svg { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.lb-btn:hover, .lb-btn:focus-visible { background: var(--c-ink, #000); color: var(--c-paper, #fff); }
.lb-btn[hidden] { display: none; }
.lb-count { min-width: 4.5em; text-align: center; }
@media (max-width: 700px) {
  .lb-bar { flex-direction: column; align-items: stretch; }
  .lb-credit { display: none; }
}
.img-circle .credit-panel { right: auto; width: max(100%, 300px); max-height: none; }

/* chrome sound toggle (ex.soundToggle) */
.chrome-sound { position: absolute; top: 5vh; right: 4vw; pointer-events: auto; display: flex; align-items: center; gap: .6em; color: var(--chrome-fg, #fff); transition: color .9s ease; }
.chrome-sound .sound-label { color: inherit; }
@media (max-width: 700px) { .chrome-sound { top: 4vh; right: 6vw; } }

/* route-mini (route.mini): a small copy of the route with a "you are here" marker */
.route-mini svg path { stroke-width: 1.2px; }
.route-mini .route-mini-dot { position: absolute; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: var(--chrome-fg, #000); }
.route-mini .route-mini-dot.rupture { background: var(--c-accent, red); }
.route-here { position: absolute; width: 0; height: 0; }
.route-here::before { content: ""; position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--c-accent, red); }
.route-here-label { position: absolute; left: 12px; top: 6px; white-space: nowrap; }
.route-mini.clickable { cursor: pointer; }
.route-mini .route-mini-label { position: absolute; right: 0; top: calc(100% + 10px); white-space: nowrap; text-align: right; }
.sound-label { display: inline-grid; }
.sound-label > span { grid-area: 1 / 1; }
.sound-toggle .sl-on, .sound-toggle.on .sl-off { visibility: hidden; }
.sound-toggle.on .sl-on { visibility: visible; }
/* mat: a white passe-partout drawn outside the image (box-shadow), so the image keeps its exact position */
.mat-white .inner { box-shadow: 0 0 0 var(--mat, 3.3vw) #fff, 0 1px 0 calc(var(--mat, 3.3vw) + 1px) rgba(0,0,0,.06); }
.el-line, .pin-layer > .el-line, .el-line svg { pointer-events: none; }

/* walkthrough on phones (walkList) */
.el-walkthrough.wt-list { position: relative; left: 0; top: 0; width: 100vw; padding: 12vh 6vw 10vh; }
.wt-list .inner { display: flex; flex-direction: column; gap: 9vh; }
.wt-list-head, .wt-list-item { display: flex; flex-direction: column; gap: 1.2vh; }
.wt-list-item img { display: block; width: 100%; height: auto; margin-bottom: 1.5vh; }
.wt-list .para { margin: 0; }

/* walkthrough: slides inside a photo (items[].slides) */
.wt-slides { position: absolute; top: 0; height: 100%; will-change: transform; }
.wt-slides img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .8s ease; }

.wt-slide-ctl { position: absolute; left: 2.4vw; bottom: 3vh; z-index: 2; display: flex; align-items: center; gap: 12px; }
.wt-slide-btn { width: 44px; height: 44px; border-radius: 50%; background: rgba(21,20,19,.55); color: #fff; font: 400 20px/1 var(--font); display: flex; align-items: center; justify-content: center; transition: background-color .3s; }
.wt-slide-btn:hover, .wt-slide-btn:focus-visible { background: rgba(21,20,19,.9); }
.wt-slide-count { min-width: 3em; text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
/* walkthrough: dots navigation (nav: "dots"), bottom right */
.wt-hud.wt-hud-dots { pointer-events: none; left: auto; right: 4vw; bottom: 5vh; width: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.wt-hud-dots .wt-labels { width: 40vw; text-align: right; }
.wt-hud-dots .wt-label { left: auto; right: 0; }
.wt-dots { display: flex; gap: 14px; pointer-events: auto; }
.wt-dot { position: relative; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--chrome-fg, #fff); }
.wt-dot::after { content: ""; position: absolute; inset: -8px; }
.wt-dot-fill { position: absolute; inset: 2px; border-radius: 50%; background: var(--c-accent, #fff); opacity: 0; }
.wt-intro .wt-intro-text { max-width: 36vw; }
.wt-hud-dots .wt-label { text-shadow: 0 1px 8px rgba(0,0,0,.55); }

.sound-icon { display: none; width: 26px; height: 26px; }
.sound-icon svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.sound-toggle.on .sound-icon .si-on { display: inline; }
.sound-toggle.on .sound-icon .si-off { display: none; }

  .chrome-sound { top: calc(4vh - 6px); }
  .chrome-sound .sound-mark, .chrome-sound .sound-label { display: none; }
  .chrome-sound .sound-icon { display: block; }
}

/* flow screen (screen.flow, usually on phones): elements stand one under another and the screen scrolls.
   Only the box's width, margins and order count; positions are ignored. */
.screen.flow:not([hidden]) { display: flex; flex-direction: column; align-items: flex-start; padding: 4vh 6vw 10vh; }
.screen.flow > .el { position: relative !important; left: auto !important; right: auto !important; top: auto !important; bottom: auto !important; flex: none; min-height: 0; max-width: 100%; margin-top: 5vh; }
.screen.flow > .el:first-child { margin-top: 0; }
.screen.flow .img-caption { position: static; }
/* phones: the pinned layer is as tall as what is actually visible (iOS Safari bars), see SVH in engine.js */
@media (max-width: 700px) { @supports (height: 1svh) { .pin-layer { height: 100svh; } } }
/* flow: an image block grows with its caption (the ratio sits on the picture, not on the block) */
.screen.flow > .el-image:not(.img-circle) { aspect-ratio: auto !important; }
.screen.flow > .el-image:not(.img-circle) .inner, .screen.flow > .el-image:not(.img-circle) img { height: auto; }

</style>

<body>
  <div id="root"></div>

// smooth line through the points (Catmull-Rom → Bézier), viewBox 0 0 1000 300
function chartPath(data, w, h, pad) {
  const max = Math.max(...data), n = data.length;
  const pts = data.map((v, i) => [(i / (n - 1)) * w, h - pad - (v / max) * (h - 2 * pad)]);
  let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C ${c1.map((x) => x.toFixed(1)).join(" ")}, ${c2.map((x) => x.toFixed(1)).join(" ")}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

  <script>
/* Effects library. Every effect has an ID; exhibitions refer to effects by ID only.
   Add an effect here once and it is available to every element on every screen.

   Step (as written in exhibition data):
     { effect: "fade-up", speed: "normal", feel: "soft", delay: 0, ...effect params }
   Optional raw overrides: duration (ms), ease (CSS easing, e.g. "ease-in").
   Presets: speed fast/normal/slow, feel soft/standard/sharp. */
(function (g) {
  "use strict";

  const SPEED = { fast: 450, normal: 900, slow: 1600 };
  const FEEL = {
    soft: "cubic-bezier(.16,1,.3,1)",
    standard: "cubic-bezier(.4,0,.2,1)",
    sharp: "cubic-bezier(.76,0,.24,1)"
  };
  const DIR = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };

  const timing = (s, extra) =>
    Object.assign(
      {
        duration: s.duration != null ? s.duration : SPEED[s.speed || "normal"],
        easing: s.ease || FEEL[s.feel || "soft"],
        delay: s.delay || 0,
        fill: "both"
      },
      extra
    );

  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)");
  const rand = (a, b) => a + Math.random() * (b - a);

  function splitWords(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((tn) => {
      const frag = document.createDocumentFragment();
      tn.textContent.split(/(\s+)/).forEach((part) => {
        if (!part) return;
        if (/^\s+$/.test(part)) frag.appendChild(document.createTextNode(part));
        else {
          const sp = document.createElement("span");
          sp.className = "fx-w";
          sp.style.display = "inline-block";
          sp.textContent = part;
          frag.appendChild(sp);
        }
      });
      tn.parentNode.replaceChild(frag, tn);
    });
  }

  /* ---- simple effects: frames(step) -> [from, to]; "out" plays them reversed ---- */
  const effects = {
    "fade-in": {
      label: "Fade in",
      params: {},
      frames: () => [{ opacity: 0 }, { opacity: 1 }]
    },
    "fade-up": {
      label: "Fade + rise",
      params: { distance: "40px" },
      frames: (s) => [
        { opacity: 0, transform: `translateY(${s.distance || "40px"})` },
        { opacity: 1, transform: "translateY(0)" }
      ]
    },
    "slide-in": {
      label: "Slide in",
      params: { from: "left|right|up|down", distance: "10vw" },
      frames: (s) => {
        const [x, y] = DIR[s.from || "left"];
        const d = s.distance || "10vw";
        return [
          { opacity: 0, transform: `translate(calc(${x} * ${d}), calc(${y} * ${d}))` },
          { opacity: 1, transform: "translate(0,0)" }
        ];
      }
    },
    wipe: {
      label: "Wipe reveal",
      params: { from: "left|right|up|down" },
      frames: (s) => {
        // negative insets on the other sides: tight line-heights let glyphs overflow the box
        const start = {
          left: "inset(-40% 100% -40% -5%)",
          right: "inset(-40% -5% -40% 100%)",
          up: "inset(-5% -5% 100% -5%)",
          down: "inset(100% -5% -5% -5%)"
        }[s.from || "left"];
        return [{ clipPath: start }, { clipPath: "inset(-40% -5% -40% -5%)" }];
      }
    },
    "blur-in": {
      label: "Blur in",
      params: { blur: "24px" },
      frames: (s) => [
        { opacity: 0, filter: `blur(${s.blur || "24px"})` },
        { opacity: 1, filter: "blur(0)" }
      ]
    },
    "scale-in": {
      label: "Scale in",
      params: { from: "0.92" },
      frames: (s) => [
        { opacity: 0, transform: `scale(${s.from || 0.92})` },
        { opacity: 1, transform: "scale(1)" }
      ]
    },
    "drift-in": {
      label: "Drift in (slow, for textures)",
      params: { x: "6vw", y: "4vh" },
      defaults: { speed: "slow" },
      frames: (s) => [
        { opacity: 0, transform: `translate(${s.x || "6vw"}, ${s.y || "4vh"}) scale(1.06)` },
        { opacity: 1, transform: "translate(0,0) scale(1)" }
      ]
    },
    move: {
      label: "Move (use as a 2nd step)",
      params: { x: "0", y: "0" },
      frames: (s) => [{ transform: "translate(0,0)" }, { transform: `translate(${s.x || 0}, ${s.y || 0})` }]
    }
  };

  /* ---- custom effects: run(node, step, dir) -> Promise ---- */
  const formatNumber = (v, dec, pre, suf) =>
    (pre || "") + Number(v).toLocaleString("en-US", { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }) + (suf || "");

  /* dash length for drawing a stroke: with vector-effect non-scaling-stroke dashes are measured on screen, not in
     viewBox units, so the path length is scaled by the drawing's on-screen scale (too long a dash is harmless) */
  function dashLength(p) {
    const L = p.getTotalLength ? p.getTotalLength() : 1000;
    const m = p.getScreenCTM && p.getScreenCTM();
    return L * Math.max(1, m ? Math.hypot(m.a, m.b) : 1, m ? Math.hypot(m.c, m.d) : 1) + 2;
  }

  const custom = {
    /* route: the route's segments draw one after another (time ∝ length); each stop appears when the line reaches it */
    route: {
      label: "Route line draws stop to stop (type route)",
      params: { duration: 5000 },
      run(node, s, dir) {
        const t = timing(s);
        const segs = Array.from(node.querySelectorAll(".route-seg"));
        const stops = Array.from(node.querySelectorAll(".route-stop"));
        const extra = Array.from(node.querySelectorAll(".route-end, .route-tick"));
        const last = Array.from(node.querySelectorAll(".route-here, .route-mini-label"));
        const lens = segs.map((p) => p.getTotalLength());
        const total = lens.reduce((a, b) => a + b, 0) || 1;
        const ps = [];
        const show = (el, at) => ps.push(el.animate([{ opacity: 0, transform: el.style.transform || "none" }, { opacity: 1, transform: el.style.transform || "none" }],
          { duration: t.duration ? 600 : 0, delay: t.delay + at, easing: "ease-out", fill: "both" }).finished.catch(() => {}));
        let at = 0;
        if (stops[0]) show(stops[0], 0);
        extra.forEach((e) => show(e, 0));
        segs.forEach((p, i) => {
          const d = (t.duration * lens[i]) / total;
          const L = dashLength(p);
          p.style.strokeDasharray = L + " " + L;
          ps.push(p.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: d, delay: t.delay + at, easing: "cubic-bezier(.4,0,.6,1)", fill: "both" }).finished.catch(() => {}));
          at += d;
          if (stops[i + 1]) show(stops[i + 1], at - Math.min(200, d / 3));
        });
        last.forEach((e) => show(e, at)); // "you are here" appears once the whole line is drawn
        return Promise.all(ps);
      }
    },

    /* count: a counter element counts up from 0 and its underline draws itself */
    count: {
      label: "Number counts up, line drawn under it (type counter)",
      params: { duration: 1800 },
      run(node, s, dir) {
        const t = timing(s);
        const num = node.querySelector(".counter-num");
        const ps = [];
        if (num) {
          const v = +num.dataset.value, dec = +num.dataset.decimals, pre = num.dataset.prefix, suf = num.dataset.suffix;
          const ease = (x) => 1 - Math.pow(1 - x, 3);
          ps.push(new Promise((res) => {
            const t0 = performance.now() + t.delay;
            num.textContent = formatNumber(dir === "out" ? v : 0, dec, pre, suf);
            const tick = (now) => {
              const k = t.duration ? Math.min(1, Math.max(0, (now - t0) / t.duration)) : 1;
              const e = ease(dir === "out" ? 1 - k : k);
              num.textContent = formatNumber(v * e, dec, pre, suf);
              if (k < 1) requestAnimationFrame(tick); else res();
            };
            requestAnimationFrame(tick);
          }));
          ps.push(num.animate([{ opacity: 0 }, { opacity: 1 }], { duration: Math.min(500, t.duration), delay: t.delay, fill: "both" }).finished.catch(() => {}));
        }
        const line = node.querySelector(".counter-line path");
        if (line) {
          const L = dashLength(line);
          line.style.strokeDasharray = L + " " + L;
          ps.push(line.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: t.duration, delay: t.delay + t.duration * 0.25, easing: "cubic-bezier(.45,.05,.35,1)", fill: "both" }).finished.catch(() => {}));
        }
        const label = node.querySelector(".counter-label");
        if (label) ps.push(label.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 700, delay: t.delay + t.duration * 0.5, easing: FEEL.soft, fill: "both" }).finished.catch(() => {}));
        return Promise.all(ps);
      }
    },
    /* draw: SVG strokes inside the element are drawn like a pencil line (stroke-dashoffset).
       Paths are drawn one after another, each taking time in proportion to its length, so it reads as one hand. */
    draw: {
      label: "Line draws itself (SVG strokes, one after another)",
      params: { duration: 4500, overlap: 0.15 },
      run(node, s, dir) {
        const t = timing(s, { fill: "both" });
        const paths = Array.from(node.querySelectorAll("path, line, polyline, circle, ellipse"));
        const filled = (p) => p.getAttribute("fill") && p.getAttribute("fill") !== "none";
        const lens = paths.map((p) => (filled(p) ? 0 : p.getTotalLength ? p.getTotalLength() : 1000));
        const dash = paths.map((p) => (filled(p) ? 0 : dashLength(p)));
        const total = lens.reduce((a, b) => a + b, 0) || 1;
        const ov = s.overlap != null ? s.overlap : 0.15;
        let at = 0;
        return Promise.all(paths.map((p, i) => {
          const L = lens[i];
          const d = (t.duration * L) / total;
          if (p.getAttribute("fill") && p.getAttribute("fill") !== "none") {
            // a filled shape (e.g. an accent disc) appears at its turn in the sequence
            const a = p.animate(dir === "out" ? [{ opacity: 1 }, { opacity: 0 }] : [{ opacity: 0 }, { opacity: 1 }], { duration: REDUCE.matches ? 0 : 900, delay: t.delay + at, easing: "ease-out", fill: "both" });
            return a.finished.catch(() => {});
          }
          const DL = dash[i];
          p.style.strokeDasharray = DL + " " + DL;
          const kf = [{ strokeDashoffset: DL }, { strokeDashoffset: 0 }];
          const a = p.animate(dir === "out" ? kf.slice().reverse() : kf, { duration: d, delay: t.delay + at, easing: s.ease || "cubic-bezier(.45,.05,.35,1)", fill: "both" });
          at += d * (1 - ov);
          return a.finished.catch(() => {});
        }));
      }
    },
    "words-in": {
      label: "Words appear one by one",
      params: { stagger: 22, distance: "0.5em" },
      run(node, s, dir) {
        const t = timing(s);
        if (!node.querySelector(".fx-w")) splitWords(node);
        const words = Array.from(node.querySelectorAll(".fx-w"));
        const st = s.stagger != null ? s.stagger : 22;
        const d = s.distance || "0.5em";
        const from = { opacity: 0, transform: `translateY(${d})` };
        const to = { opacity: 1, transform: "translateY(0)" };
        const n = words.length;
        return Promise.all(
          words.map((w, i) =>
            w.animate(dir === "out" ? [to, from] : [from, to], {
              duration: t.duration,
              easing: t.easing,
              delay: t.delay + (dir === "out" ? ((n - 1 - i) * st) / 4 : i * st),
              fill: "both"
            }).finished
          )
        );
      }
    },
    "strips-assemble": {
      label: "Image slides together from vertical strips (alternating up / down)",
      params: { strips: 7 },
      run(node, s, dir) {
        const img = node.querySelector("img");
        if (!img) return Promise.resolve();
        node.querySelectorAll(".fx-tiles").forEach((x) => x.remove());
        const n = s.strips || 7;
        const t = timing(s);
        const wrap = document.createElement("div");
        wrap.className = "fx-tiles";
        wrap.style.cssText = "position:absolute;inset:0;overflow:hidden;pointer-events:none";
        const src = img.currentSrc || img.src;
        const anims = [];
        for (let i = 0; i < n; i++) {
          const strip = document.createElement("div");
          strip.style.cssText =
            `position:absolute;top:0;height:100%;left:${(i / n) * 100}%;width:calc(${100 / n}% + 1px);` +
            `background-image:url("${src}");background-size:${n * 100}% 100%;` +
            `background-position:${n > 1 ? (i / (n - 1)) * 100 : 0}% 0`;
          wrap.appendChild(strip);
          const off = { transform: `translateY(${i % 2 ? 105 : -105}%)` };
          const home = { transform: "translateY(0)" };
          anims.push(
            strip.animate(dir === "out" ? [home, off] : [off, home], {
              duration: t.duration * 0.7,
              delay: t.delay + i * ((t.duration * 0.3) / n),
              easing: t.easing,
              fill: "both"
            })
          );
        }
        node.appendChild(wrap);
        img.style.visibility = "hidden";
        return Promise.all(anims.map((a) => a.finished)).then(() => {
          if (dir !== "out") {
            img.style.visibility = "";
            wrap.remove();
          }
        });
      }
    },
    "tiles-assemble": {
      label: "Image assembles from square tiles",
      params: { cols: 8, rows: 6, scatter: "25" },
      run(node, s, dir) {
        const img = node.querySelector("img");
        if (!img) return Promise.resolve();
        node.querySelectorAll(".fx-tiles").forEach((n) => n.remove());
        const cols = s.cols || 8;
        const rows = s.rows || 6;
        const scatter = Number(s.scatter != null ? s.scatter : 25);
        const t = timing(s);
        const wrap = document.createElement("div");
        wrap.className = "fx-tiles";
        wrap.style.cssText = "position:absolute;inset:0;overflow:visible;pointer-events:none";
        const src = img.currentSrc || img.src;
        const anims = [];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const tile = document.createElement("div");
            tile.style.cssText =
              `position:absolute;left:${(c / cols) * 100}%;top:${(r / rows) * 100}%;` +
              `width:calc(${100 / cols}% + 1px);height:calc(${100 / rows}% + 1px);` +
              `background-image:url("${src}");background-size:${cols * 100}% ${rows * 100}%;` +
              `background-position:${cols > 1 ? (c / (cols - 1)) * 100 : 0}% ${rows > 1 ? (r / (rows - 1)) * 100 : 0}%`;
            wrap.appendChild(tile);
            const away = {
              opacity: 0,
              transform: `translate(${rand(-scatter, scatter)}vw, ${rand(-scatter, scatter)}vh) scale(${rand(0.2, 0.8)})`
            };
            const home = { opacity: 1, transform: "translate(0,0) scale(1)" };
            anims.push(
              tile.animate(dir === "out" ? [home, away] : [away, home], {
                duration: t.duration * 0.6,
                delay: t.delay + rand(0, t.duration * 0.4),
                easing: t.easing,
                fill: "both"
              })
            );
          }
        }
        node.appendChild(wrap);
        img.style.visibility = "hidden";
        return Promise.all(anims.map((a) => a.finished)).then(() => {
          if (dir !== "out") {
            img.style.visibility = "";
            wrap.remove();
          }
        });
      }
    }
  };

  /* ---- scene effects: whole-screen sequences. run(screenEl, step, ctx) -> Promise ---- */
  const scenes = {
    "elevator-doors": {
      label: "Elevator from inside: light in the door gap rises past textures, floor counter on the left, doors open. With move/hold: the cabin slows down at every floor, a band of landing light passes over the doors",
      params: { duration: 5600, floors: 4, move: "1300 (ms per floor; enables stop-and-go)", hold: "400 (ms pause at a floor)", landing: "#ffd9a8 (light band colour, false = none)", gap: "5vw", from: "#000", via: "#9fb3c1", to: "#000", glow: "#2a4bff", finale: "[element ids]", textures: "[image urls]" },
      run(screenEl, s, ctx) {
        const floors = s.floors != null ? s.floors : 4;
        // stop-and-go (s.move): doors crack open, then per floor: move (ease in-out) + hold
        const START = 700;
        const steps = s.move ? floors : 0;
        const ride = steps ? START + floors * (s.move + (s.hold || 0)) : (s.duration || 5600) * 0.78;
        const D = steps ? ride + 1250 : s.duration || 5600;
        const passAt = (k) => START + k * (s.move + (s.hold || 0)) + s.move / 2; // floor k+1 is passed half way through its move
        const gap = s.gap || "5vw";
        const ease = s.ease || "cubic-bezier(.6,0,.2,1)";
        const layer = document.createElement("div");
        layer.className = "fx-scene";
        layer.style.cssText = "position:absolute;inset:0;overflow:hidden;z-index:5;pointer-events:none";

        // shaft seen through the gap
        const shaft = document.createElement("div");
        shaft.style.cssText = `position:absolute;inset:0;overflow:hidden;background:${s.from || "#000"}`;
        const tex = s.textures || [];
        const STEP = 90; // vh
        const track = document.createElement("div");
        const trackH = (s.finale ? 100 : 0) + Math.max(tex.length, 1) * STEP;
        track.style.cssText = `position:absolute;left:0;right:0;top:0;height:${trackH}vh`;
        tex.forEach((u, i) => {
          const im = document.createElement("img");
          im.src = u;
          im.alt = "";
          const off = s.finale ? 100 : 0;
          im.style.cssText = `position:absolute;top:${off + i * STEP}vh;left:${i % 2 ? 8 : 34}vw;width:58vw`;
          track.appendChild(im);
        });
        (s.finale || []).forEach((id) => {
          const src = screenEl.querySelector(`[data-id="${id}"]`);
          if (!src) return;
          const copy = src.cloneNode(true);
          copy.removeAttribute("data-id");
          track.appendChild(copy);
        });
        shaft.appendChild(track);
        layer.appendChild(shaft);
        const travel = Math.max(trackH - 100, 0);
        let trackFrames = [{ transform: `translateY(-${travel}vh)` }, { transform: "translateY(0)" }];
        if (steps) {
          const y = (k) => `translateY(-${travel * (1 - k / floors)}vh)`;
          trackFrames = [{ offset: 0, transform: y(0) }, { offset: START / ride, transform: y(0), easing: "cubic-bezier(.5,0,.3,1)" }];
          for (let k = 1; k <= floors; k++) {
            const t = START + (k - 1) * (s.move + (s.hold || 0)) + s.move;
            trackFrames.push({ offset: t / ride, transform: y(k), easing: "cubic-bezier(.5,0,.3,1)" });
            trackFrames.push({ offset: Math.min((t + (s.hold || 0)) / ride, 1), transform: y(k), easing: "cubic-bezier(.5,0,.3,1)" });
          }
        }
        const aTrack = track.animate(trackFrames, { duration: ride, easing: steps ? "linear" : ease, fill: "both" });
        const aShaft = shaft.animate(
          (s.via
            ? [{ backgroundColor: s.from || "#000" }, { backgroundColor: s.via }, { backgroundColor: s.to || "#000" }]
            : [{ backgroundColor: s.from || "#000" }, { backgroundColor: s.to || "#9fb3c1" }]),
          { duration: ride, easing: "ease-in-out", fill: "both" }
        );

        // doors: closed → crack open to the gap → ride → slide away
        const o = (ms) => Math.min(Math.max(ms / D, 0), 1);
        const doorFrames = (sign) => [
          { offset: 0, transform: "translateX(0)" },
          { offset: o(300), transform: "translateX(0)", easing: "cubic-bezier(.4,0,.2,1)" },
          { offset: o(1000), transform: `translateX(calc(${sign} * ${gap} / 2))` },
          { offset: o(ride), transform: `translateX(calc(${sign} * ${gap} / 2))`, easing: "cubic-bezier(.76,0,.24,1)" },
          { offset: 1, transform: `translateX(${sign * 101}%)` }
        ];
        const door = (side) => {
          const d = document.createElement("div");
          d.style.cssText = `position:absolute;top:0;bottom:0;${side}:0;width:50%;background:#000`;
          // LED strip along the inner edge: white-hot core + coloured bloom spilling onto the door and into the gap
          const inner = side === "left" ? "right" : "left";
          const g = s.glow || "#2a4bff";
          const wash = document.createElement("div");
          wash.style.cssText =
            `position:absolute;top:0;bottom:0;${inner}:0;width:14vw;pointer-events:none;` +
            `background:linear-gradient(to ${inner}, transparent, ${g}33 70%, ${g}66);`;
          const strip = document.createElement("div");
          strip.style.cssText =
            `position:absolute;top:0;bottom:0;${inner}:0;width:3px;background:#eef2ff;` +
            `box-shadow:0 0 4px #fff, 0 0 12px ${g}, 0 0 32px ${g}, 0 0 80px ${g}, 0 0 160px ${g}99`;
          d.appendChild(wash);
          d.appendChild(strip);
          layer.appendChild(d);
          return d.animate(doorFrames(side === "left" ? -1 : 1), { duration: D, fill: "both" });
        };
        const aL = door("left");
        const aR = door("right");
        const aOut = shaft.animate([{ opacity: 1 }, { opacity: 0 }], { duration: D - ride, delay: ride, easing: "ease-in", fill: "forwards" });

        // landing light: a warm band sweeps down over doors and gap each time a floor is passed
        const sweeps = [];
        if (steps && s.landing !== false) {
          const c = s.landing || "#ffd9a8";
          for (let k = 0; k < floors; k++) {
            const band = document.createElement("div");
            band.style.cssText =
              "position:absolute;left:0;right:0;top:0;height:46vh;pointer-events:none;mix-blend-mode:screen;z-index:1;" +
              `background:linear-gradient(transparent, ${c}14 30%, ${c}38 50%, ${c}14 70%, transparent)`;
            layer.appendChild(band);
            const len = s.move * 0.9;
            sweeps.push(band.animate(
              [{ transform: "translateY(-50vh)", opacity: 0 }, { opacity: 1, offset: 0.25 }, { opacity: 1, offset: 0.75 }, { transform: "translateY(105vh)", opacity: 0 }],
              { duration: len, delay: passAt(k) - len / 2, easing: "cubic-bezier(.4,0,.6,1)", fill: "both" }
            ));
          }
        }

        // floor counter on the left: ▲ blinks while riding, floors stacked top (highest) to bottom, the reached one flashes
        const ind = document.createElement("div");
        ind.style.cssText =
          "position:absolute;left:6vw;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:.35em;" +
          "font-family:var(--font);font-weight:500;font-size:clamp(26px,3.4vw,58px);line-height:1;color:#fff;z-index:2";
        const arrow = document.createElement("span");
        arrow.textContent = "▲";
        arrow.style.cssText = "font-size:.5em;margin-bottom:.4em";
        ind.appendChild(arrow);
        const aArrow = arrow.animate([{ opacity: 1 }, { opacity: 0.15 }, { opacity: 1 }], { duration: 900, iterations: Math.max(1, Math.round(ride / 900)) });
        const digits = [];
        for (let i = floors; i >= 0; i--) {
          const d = document.createElement("span");
          d.textContent = i;
          d.style.cssText = "display:block;opacity:.22;transition:opacity .25s";
          ind.appendChild(d);
          digits[i] = d;
        }
        layer.appendChild(ind);
        const aInd = ind.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, delay: ride, fill: "forwards" });
        const g = s.glow || "#2a4bff";
        let raf = 0;
        let shown = -1;
        const tick = () => {
          let f;
          if (steps) {
            const t = aTrack.currentTime == null ? ride : aTrack.currentTime;
            f = 0;
            for (let k = 0; k < floors; k++) if (t >= passAt(k)) f = k + 1;
          } else {
            const p = aTrack.effect.getComputedTiming().progress;
            f = Math.round((p == null ? 1 : p) * floors);
          }
          if (f !== shown) {
            shown = f;
            digits.forEach((d, i) => { d.style.opacity = i === f ? "1" : ".22"; });
            if (f > 0) digits[f].animate(
              [{ textShadow: `0 0 6px #fff, 0 0 22px ${g}, 0 0 48px ${g}`, transform: "scale(1.18)" }, { textShadow: "0 0 0 transparent", transform: "scale(1)" }],
              { duration: 700, easing: "ease-out" }
            );
          }
          if (aTrack.playState !== "finished") raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);

        screenEl.appendChild(layer);
        Promise.all([aL.finished, aR.finished, aOut.finished, aInd.finished, aShaft.finished, aArrow.finished, ...sweeps.map((a) => a.finished)]).then(() => layer.remove()).catch(() => {});
        return { total: ride + 300, cancel() { cancelAnimationFrame(raf); layer.remove(); } };
      }
    },
    "elevator-rise": {
      label: "Elevator ride up: rushing floor lines, floor counter, colour shift",
      params: { duration: 5200, floors: 4, to: "#16242d", label: "{en:'Level', sv:'Plan'}" },
      run(screenEl, s, ctx) {
        const D = s.duration || 5200;
        const floors = s.floors != null ? s.floors : 4;
        const ease = s.ease || "cubic-bezier(.65,0,.25,1)";
        const layer = document.createElement("div");
        layer.className = "fx-scene";
        layer.style.cssText = "position:absolute;inset:0;overflow:hidden;z-index:5;pointer-events:none";

        const LINES = 46;
        const GAP = 14; // vh
        const track = document.createElement("div");
        track.style.cssText = `position:absolute;left:0;right:0;top:0;height:${LINES * GAP}vh`;
        for (let i = 0; i < LINES; i++) {
          const line = document.createElement("div");
          const strong = i % 5 === 0;
          line.style.cssText =
            `position:absolute;left:0;right:0;top:${i * GAP}vh;height:${strong ? 3 : 1}px;` +
            `background:#fff;opacity:${strong ? 0.85 : 0.35}`;
          track.appendChild(line);
        }
        layer.appendChild(track);
        const travel = (LINES * GAP - 100);
        const a1 = track.animate(
          [{ transform: `translateY(-${travel}vh)` }, { transform: "translateY(0)" }],
          { duration: D, easing: ease, fill: "both" }
        );

        // floor counter: a vertical reel clipped to one line
        const counter = document.createElement("div");
        counter.style.cssText =
          "position:absolute;left:6vw;bottom:7vh;display:flex;align-items:flex-end;gap:1.2vw;color:#fff;" +
          "font-family:var(--font);font-weight:500;line-height:1";
        const lbl = document.createElement("div");
        lbl.style.cssText = "font-size:clamp(14px,1.4vw,22px);font-weight:400;letter-spacing:.04em;text-transform:uppercase;padding-bottom:.6em";
        lbl.textContent = (s.label && (s.label[ctx.lang()] || s.label.en)) || "";
        const win = document.createElement("div");
        win.style.cssText = "height:1em;overflow:hidden;font-size:clamp(72px,12vw,200px)";
        const reel = document.createElement("div");
        for (let i = 0; i <= floors; i++) {
          const d = document.createElement("div");
          d.style.cssText = "height:1em;line-height:1";
          d.textContent = i;
          reel.appendChild(d);
        }
        win.appendChild(reel);
        counter.appendChild(lbl);
        counter.appendChild(win);
        layer.appendChild(counter);
        const a2 = reel.animate(
          [{ transform: "translateY(0)" }, { transform: `translateY(-${floors}em)` }],
          { duration: D, easing: ease, fill: "both" }
        );

        screenEl.appendChild(layer);
        const bgTimer = setTimeout(() => ctx.setBg(s.to || "#16242d", D * 0.55), D * 0.35);
        const fadeAt = D + (s.hold != null ? s.hold : 300);
        const a3 = layer.animate([{ opacity: 1 }, { opacity: 0 }], {
          duration: 700,
          delay: fadeAt,
          easing: "ease-out",
          fill: "both"
        });
        const total = fadeAt + 700;
        const done = Promise.all([a1.finished, a2.finished, a3.finished]).then(() => layer.remove());
        return { total: D + 300, done, cancel() { clearTimeout(bgTimer); layer.remove(); } };
      }
    }
  };

  /* ---- hover effects are pure CSS, listed here so the catalog can show them ---- */
  const hovers = {
    lift: "Raise 8px",
    zoom: "Image zooms 5%",
    underline: "Underline grows in",
    dim: "Others dim, this one stays bright"
  };

  /* ---- scroll effects: set as element properties on scrollable screens (handled by the engine) ---- */
  const scrollFx = {
    "frame-parallax": "parallax: 12 — the image drifts inside its frame while the frame scrolls (lags behind). Number = max shift, % of frame height; negative reverses",
    "blob-zoom": "type \"blobzoom\" element with blob: {mask, aspect, focal, lobeR, box, range} — a blob-shaped window onto a full-screen image; scrolling zooms into the blob until the whole image is revealed",
    pin: "pin: [0, 100] — element stays still while the screen scrolls from 0 to 100vh",
    scrub: "scrub: { start, end, frames } — animation plays in step with scrolling (e.g. photo opening up)",
    "reveal-on-scroll": "reveal: \"scroll\" — enter effect plays when the element (or each paragraph) scrolls into view",
    "walk-through": "type \"walkthrough\" element with items: [{artist, goto, src, works: [{title, medium}], paragraphs, credits}] — rooms side by side (photo + text), walked through left to right while scrolling down (also ← → keys and sideways swipe); photos drift and come closer, counter and progress line bottom left. Long text stays put, is cut off above the counter with a fade and scrolls on its own under the cursor. Options: hint, credit, parallax (8), gap (10vw), textWidth (40vw), textBottom (vh above the bottom; default: above the counter), tail (black space after the last room; default: last text ends in the middle)",
    "info-bubble": "ex.info: {texture, target} — swaying circle of texture with an i, bottom right, on every screen; screen.info: \"<id>\" picks where it leads, info: false hides it; click plays circle-open (the circle grows over the screen into the new page). On a screen with infoPage: true it shows × and leads back",
    "line": "type \"line\" element: {viewBox, paths: [d, ...], stroke, width} — an SVG drawing; with enter {effect: \"draw\"} it draws itself stroke by stroke",
    "grid": "type \"grid\" element: {columns: 12, margin: \"4vw\", gutter: \"1.6vw\", color, opacity} — thin column lines of the layout grid",
    "button": "type \"button\" / \"buttons\" (row, items: [...]): {text, goto, variant: \"solid\" | \"link\", color, arrow} — pill button or underlined link",
    "counter": "type \"counter\": {value, decimals, prefix, suffix, label} with enter {effect: \"count\"} — counts up, line drawn under the number",
    "route": "type \"route\": a life as one line, years across, a value (e.g. latitude) up and down; stops appear as the line reaches them (enter effect \"route\"); vertical: true for phones; current: index of the highlighted stop",
    "line-across": "screen.line: true | {d, color, duration} — one free line runs across the screen while that screen comes in (transition)",
    "sound-toggle": "type \"sound\" element: {on, off} labels — toggles sound for the whole exhibition (off by default, remembered); engine.sound is true/false, event \"ex-sound\" on window",
    "cursor-square": "theme.cursor: \"square\" — the pointer becomes a square that inverts what is under it (white on black, black on white); mouse / trackpad only"
  };

  /* ---- runner ---- */
  function runStep(node, step, dir, baseDelay) {
    const s = Object.assign({}, (effects[step.effect] || {}).defaults, step);
    s.delay = (s.delay || 0) + (baseDelay || 0);
    if (REDUCE.matches) { s.duration = 0; s.delay = 0; s.stagger = 0; } // prefers-reduced-motion: final state at once
    if (custom[s.effect]) return custom[s.effect].run(node, s, dir || "in");
    const fx = effects[s.effect];
    if (!fx) {
      console.warn("Unknown effect id:", s.effect);
      return Promise.resolve();
    }
    let frames = fx.frames(s);
    if (dir === "out") frames = frames.slice().reverse();
    const anim = node.animate(frames, timing(s));
    // entered elements return to their natural CSS state, so hover styles can act on them
    if (dir !== "out" && s.effect !== "move") anim.finished.then(() => anim.cancel()).catch(() => {});
    return anim.finished;
  }

  /* steps: one step or an array played one after another */
  function run(node, steps, dir, baseDelay) {
    const list = Array.isArray(steps) ? steps : [steps];
    let offset = baseDelay || 0;
    const ps = [];
    list.forEach((st) => {
      const t = timing(st);
      ps.push(runStep(node, st, dir, offset));
      offset += (st.delay || 0) + t.duration;
    });
    return Promise.all(ps);
  }

  g.FX = { SPEED, FEEL, effects, custom, scenes, hovers, scrollFx, timing, run, formatNumber, dashLength };
})(window);

  <script>
/* Exhibition engine. Knows nothing about any specific exhibition.
   Reads window.EXHIBITION (see exhibitions/<name>/exhibition.js) and plays it.

   exhibition → screens → elements (+ enter / exit / hover / click)
   Keys: ↓ ↑ Space PageUp/PageDown navigate · D toggles ID labels (for pointing at things in chat) */
(function (g) {
  "use strict";
  const FX = g.FX;

  const h = (tag, cls, css) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (css) Object.assign(e.style, css);
    return e;
  };
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  const BOX = { x: "left", y: "top", w: "width", h: "height", left: "left", top: "top", right: "right", bottom: "bottom", width: "width", height: "height" };
  const SVH = typeof CSS !== "undefined" && CSS.supports("height", "1svh"); // small-viewport units (iOS Safari 15.4+)

  class Engine {
    constructor(root, ex) {
      this.root = root;
      this.ex = ex;
      this.lang = this.pickLang();
      this.screens = [];
      this.byId = {};
      this.sound = (() => { try { return localStorage.getItem("ex-sound") === "1"; } catch (e) { return false; } })();
      this.current = null;
      this.busy = false;
      this.injectFonts();
      this.applyTheme();
      // narrow screens: elements take their `mobile` overrides; crossing the breakpoint rebuilds the screens
      const mq = matchMedia(`(max-width: ${ex.theme.mobileMax || 700}px)`);
      this.mobile = mq.matches;
      mq.addEventListener("change", () => {
        this.mobile = mq.matches;
        const id = this.current && this.current.def.id;
        this.screens = [];
        this.byId = {};
        this.current = null;
        this.busy = false;
        if (this.chrome) this.chrome.remove();
        this.build();
        if (id) this.go(id, { instant: true });
      });
      this.build();
      this.bindInput();
      const start = (location.hash || "").slice(1);
      this.go(this.byId[start] ? start : this.linear()[0].def.id, { instant: true });
    }

    /* ---------- setup ---------- */
    pickLang() {
      const langs = this.ex.meta.langs || ["en"];
      const saved = (() => { try { return localStorage.getItem("ex-lang"); } catch (e) { return null; } })();
      return langs.includes(saved) ? saved : this.ex.meta.defaultLang || langs[0];
    }

    injectFonts() {
      const css = (this.ex.theme.fonts || [])
        .map((f) => `@font-face{font-family:"${f.family}";font-weight:${f.weight};font-style:${f.style || "normal"};font-display:swap;src:${f.src.map((u) => `url("${u.url}") format("${u.format}")`).join(",")}}`)
        .join("\n");
      const st = document.createElement("style");
      st.textContent = css;
      document.head.appendChild(st);
    }

    applyTheme() {
      const t = this.ex.theme;
      const r = document.documentElement.style;
      r.setProperty("--font", t.fontStack || "sans-serif");
      Object.keys(t.colors || {}).forEach((k) => r.setProperty("--c-" + k, t.colors[k]));
      document.title = this.tr(this.ex.meta.title);
    }

    tr(v) {
      if (v == null) return "";
      if (typeof v === "string") return v;
      return v[this.lang] != null ? v[this.lang] : v.en != null ? v.en : "";
    }

    color(c) {
      const cs = this.ex.theme.colors || {};
      return cs[c] || c;
    }

    /* Screens are grouped into tracks. Scrolling moves within the current track.
       Default track is "main"; e.g. each artist can have its own track of screens. */
    trackName(rec) {
      return rec.def.track || "main";
    }

    track(name) {
      return this.screens.filter((s) => this.trackName(s) === name);
    }

    linear() {
      return this.track("main");
    }

    /* ex.nav: named menu items, each covering one or more screens ({label, screens}).
       A sub-track screen (e.g. an artist page) belongs to the item of its `back` screen. */
    navIndex(rec) {
      const nav = this.ex.nav || [];
      if (rec && rec.def.infoPage) rec = this.byId[this.infoFrom || rec.def.infoBack]; // an info page belongs to where it was opened from
      for (let hop = 0; rec && hop < 5; hop++) {
        const i = nav.findIndex((n) => n.screens.includes(rec.def.id));
        if (i >= 0) return i;
        rec = this.byId[rec.def.back];
      }
      return -1;
    }

    renderNav() {
      this.ticks.innerHTML = "";
      this.ex.nav.forEach((n, i) => {
        if (!n.screens.some((id) => this.byId[id])) return; // all its screens hidden
        const b = h("button", "tick");
        b.dataset.nav = i;
        const label = h("span", "tick-label");
        b.appendChild(label);
        b.addEventListener("click", () => this.go(n.screens.find((id) => this.byId[id])));
        this.ticks.appendChild(b);
      });
    }

    renderTicks(name) {
      if (this.ex.nav) return; // one fixed menu for the whole exhibition
      this.ticks.innerHTML = "";
      const list = this.track(name);
      if (list.length < 2) return;
      list.forEach((s) => {
        const b = h("button", "tick");
        b.dataset.id = s.def.id;
        b.setAttribute("aria-label", s.def.id);
        b.addEventListener("click", () => this.go(s.def.id));
        this.ticks.appendChild(b);
      });
    }

    /* ---------- build DOM ---------- */
    build() {
      this.root.innerHTML = "";
      this.stage = h("div", "stage");
      this.stage.style.backgroundColor = this.color(this.ex.theme.bg || "black");
      this.root.appendChild(this.stage);
      // theme.grid: the layout grid's column lines under every screen, in the screen's ink colour
      const g = this.ex.theme.grid;
      if (g) {
        const gm = Object.assign({}, g, this.mobile ? g.mobile : null);
        const layer = h("div", "grid-bg");
        Object.assign(layer.style, { left: gm.margin || "4vw", right: gm.margin || "4vw", gridTemplateColumns: `repeat(${gm.columns || 12}, 1fr)`, columnGap: gm.gutter || "1.6vw" });
        layer.style.setProperty("--grid-o", gm.opacity != null ? gm.opacity : 0.08);
        for (let i = 0; i < (gm.columns || 12); i++) layer.appendChild(h("div"));
        this.stage.appendChild(layer);
      }

      this.ex.screens.forEach((def) => {
        if (def.hide) return; // hide: true keeps the screen in exhibition.js but out of the walk (e.g. not built yet)
        // def.mobile: screen-level overrides for narrow screens, e.g. {scroll: true, flow: true}
        if (this.mobile && def.mobile) def = Object.assign({}, def, def.mobile);
        const el = h("section", "screen");
        el.dataset.id = def.id;
        el.hidden = true;
        if (def.scroll) el.classList.add("scrollable");
        if (def.flow) el.classList.add("flow"); // flow: elements stacked one under another (box gives only width and margins)
        // screen-level CSS variables, e.g. one scale unit shared by several elements
        if (def.vars) Object.keys(def.vars).forEach((k) => el.style.setProperty(k, def.vars[k]));
        if (def.scroll) el.addEventListener("scroll", () => this.onScroll(rec), { passive: true });
        const rec = { def, el, elements: [] };
        // a walkthrough screen also follows sideways trackpad swipes and ← → keys
        rec.sideways = (def.elements || []).some((ed) => ed.type === "walkthrough");
        // a screen with blob-zoom ends as soon as the image is fully open: no idle scrolling after it
        const blobEnd = Math.max(0, ...(def.elements || []).filter((ed) => ed.blob).map((ed) => ed.blob.range[1]));
        if (blobEnd) (def.elements || []).forEach((ed) => { if (ed.pin && ed.pin[1] > blobEnd) ed.pin = [ed.pin[0], blobEnd]; });
        (def.elements || []).forEach((ed) => rec.elements.push(this.buildElement(ed, el)));
        this.stage.appendChild(el);
        this.screens.push(rec);
        this.byId[def.id] = rec;
      });

      // chrome: language toggle, nav ticks, id label
      const langs = this.ex.meta.langs || [];
      this.chrome = h("div", "chrome");
      if (langs.length > 1) {
        this.langBtn = h("div", "lang");
        langs.forEach((l) => {
          const b = h("button", "lang-b");
          b.textContent = l.toUpperCase();
          b.addEventListener("click", () => this.setLang(l));
          b.dataset.lang = l;
          this.langBtn.appendChild(b);
        });
        this.chrome.appendChild(this.langBtn);
      }
      this.ticks = h("nav", "ticks");
      this.chrome.appendChild(this.ticks);
      if (this.ex.nav) this.renderNav();
      if (this.ex.info) this.buildInfo();
      if (this.ex.soundToggle) {
        const st = h("div", "chrome-sound");
        this.soundSwitch(st, st, this.ex.soundToggle === true ? {} : this.ex.soundToggle);
        this.chrome.appendChild(st);
      }
      this.idLabel = h("div", "id-label");
      this.chrome.appendChild(this.idLabel);
      this.root.appendChild(this.chrome);
      if (this.ex.theme.cursor === "square") this.cursorSquare();
      this.refreshLang();
    }

    /* info-bubble (ex.info): a small swaying circle of texture with an "i", on every screen.
       Where it leads: screen.info (a screen id), else ex.info.target; screen.info: false hides it.
       On an info page (screen.infoPage) it shows × and leads back to where the visitor came from (else screen.infoBack).
       Click: circle-open, the circle grows over the whole screen and the next page appears from under it. */
    buildInfo() {
      const b = h("button", "info-bubble");
      b.setAttribute("aria-label", "Information");
      const tex = h("span", "info-tex");
      tex.style.backgroundImage = `url("${this.ex.info.texture}")`;
      this.infoMark = h("span", "info-i");
      b.appendChild(tex);
      b.appendChild(this.infoMark);
      b.addEventListener("click", () => this.openInfo());
      this.chrome.appendChild(b);
      this.infoBtn = b;
    }

    infoTarget(rec) {
      if (!rec || !this.ex.info) return null;
      if (rec.def.infoPage) return this.infoFrom || rec.def.infoBack || null;
      if (rec.def.info === false) return null;
      const t = rec.def.info || this.ex.info.target;
      return this.byId[t] ? t : null;
    }

    updateInfo(rec) {
      if (!this.infoBtn) return;
      this.infoBtn.hidden = !this.infoTarget(rec);
      this.infoMark.textContent = rec.def.infoPage ? "×" : "i";
      this.infoBtn.setAttribute("aria-label", rec.def.infoPage ? "Close" : "Information");
    }

    async openInfo() {
      const target = this.infoTarget(this.current);
      if (!target || this.busy || this.opening) return;
      this.opening = true;
      if (!this.current.def.infoPage) this.infoFrom = this.current.def.id;
      const r = this.infoBtn.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const R = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
      const ov = h("div", "info-open");
      ov.style.backgroundImage = `url("${this.ex.info.texture}")`;
      document.body.appendChild(ov);
      const grow = ov.animate(
        [{ clipPath: `circle(${r.width / 2}px at ${cx}px ${cy}px)`, filter: "brightness(1)" }, { clipPath: `circle(${R}px at ${cx}px ${cy}px)`, filter: "brightness(.85)" }],
        { duration: this.ex.info.duration || 1000, easing: "cubic-bezier(.65,0,.35,1)", fill: "forwards" }
      );
      try { await grow.finished; } catch (e) { /* cancelled */ }
      await this.go(target);
      const fade = ov.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700, easing: "ease-out", fill: "forwards" });
      try { await fade.finished; } catch (e) { /* cancelled */ }
      ov.remove();
      this.opening = false;
    }

    /* cursor-square: the pointer becomes a square that inverts what is under it (white on black, black on white).
       Only for mouse / trackpad; touch screens keep their normal behaviour. */
    cursorSquare() {
      if (!matchMedia("(pointer: fine)").matches) return;
      const c = h("div", "cursor-square");
      document.body.appendChild(c);
      document.documentElement.classList.add("has-cursor-square");
      const LINK = ".clickable, button, a, .tick";
      window.addEventListener("pointermove", (e) => {
        c.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
        c.classList.add("on");
        c.classList.toggle("over-link", !!(e.target.closest && e.target.closest(LINK)));
      }, { passive: true });
      document.documentElement.addEventListener("pointerleave", () => c.classList.remove("on"));
    }

    buildElement(ed, screenEl) {
      // ed.mobile: overrides for narrow screens (theme.mobileMax, default 700px), e.g. {box: {...}, paragraphs: [...]}
      if (this.mobile && ed.mobile) ed = Object.assign({}, ed, ed.mobile, { box: Object.assign({}, ed.box, ed.mobile.box) });
      const node = h("div", "el el-" + ed.type);
      node.dataset.id = ed.id;
      const inner = h("div", "inner");
      node.appendChild(inner);
      const box = ed.box || {};
      Object.keys(box).forEach((k) => {
        let v = box[k];
        // phones: vh is measured without the browser bars (iOS Safari), so a box anchored to the bottom ran into one placed from the top.
        // svh is the height actually visible.
        if (this.mobile && SVH && typeof v === "string") v = v.replace(/(\d)vh\b/g, "$1svh");
        node.style[BOX[k] || k] = typeof v === "number" ? v + (k === "y" || k === "h" || k === "top" || k === "bottom" || k === "height" ? "vh" : "vw") : v;
      });
      if (ed.hide) node.style.display = "none"; // e.g. mobile: {hide: true}
      if (ed.mat) { node.classList.add("mat-" + ed.mat); if (ed.matSize) node.style.setProperty("--mat", ed.matSize); } // mat: "white" passe-partout
      if (ed.z != null) node.style.zIndex = ed.z;
      if (ed.opacity != null) inner.style.opacity = ed.opacity; // on the inner box, so enter effects on the node don't override it
      if (ed.hover) node.classList.add("hover-" + ed.hover);
      if (ed.goto) {
        node.classList.add("clickable");
        node.addEventListener("click", () => this.go(ed.goto));
        node.tabIndex = 0;
        node.addEventListener("keydown", (e) => { if (e.key === "Enter") this.go(ed.goto); });
      }
      const rec = { def: ed, node, inner, targets: [{ node, extra: 0 }], texts: [] };
      const builder = this["build_" + ed.type];
      if (!builder) console.warn("Unknown element type:", ed.type);
      else builder.call(this, ed, rec, screenEl);
      (ed.pin ? this.pinHost(screenEl, ed.pin) : screenEl).appendChild(node);
      return rec;
    }

    /* pin: [fromVh, toVh]. Pinned elements sit in a CSS `position: sticky` layer, so the browser
       holds them still while the screen scrolls (no scroll-event lag, no jitter). */
    pinHost(screenEl, pin) {
      screenEl._pins = screenEl._pins || {};
      const key = pin.join("-");
      if (!screenEl._pins[key]) {
        const u = this.mobile && SVH ? "svh" : "vh";
        const track = h("div", "pin-track", { top: pin[0] + u, height: pin[1] - pin[0] + 100 + u });
        const layer = h("div", "pin-layer");
        track.appendChild(layer);
        screenEl.appendChild(track);
        screenEl._pins[key] = layer;
      }
      return screenEl._pins[key];
    }

    typeStyle(ed, target) {
      const t = (this.ex.theme.type || {})[ed.role || "body"] || {};
      const s = target.style;
      s.fontSize = ed.size || t.size || "";
      s.fontWeight = ed.weight || t.weight || "";
      s.lineHeight = ed.lh || t.lh || "";
      s.letterSpacing = ed.ls || t.ls || "";
      s.textTransform = ed.case || t.case || "";
      s.textAlign = ed.align || "";
      s.fontStyle = ed.italic ? "italic" : "";
      s.color = this.color(ed.color || t.color || "white");
    }

    build_text(ed, rec) {
      const list = ed.paragraphs || [ed.text];
      list.forEach((p, i) => {
        const pe = h("p", "para" + (ed.indent && i > 0 ? " indent" : ""));
        this.typeStyle(ed, pe);
        if (ed.gap != null) pe.style.marginTop = i ? ed.gap : 0;
        rec.inner.appendChild(pe);
        rec.texts.push({ node: pe, value: p, rich: true });
        if (ed.stagger) rec.targets.push({ node: pe, extra: i * ed.stagger });
      });
      if (ed.stagger) rec.targets.shift();
    }

    build_image(ed, rec) {
      const img = h("img");
      img.alt = ed.alt || "";
      img.src = ed.src;
      img.style.objectFit = ed.fit || "cover";
      if (ed.focus) img.style.objectPosition = ed.focus; // which part stays in view when cropped, e.g. "50% 30%"
      if (ed.shape === "circle") rec.node.classList.add("img-circle"); // round frame, square box
      if (ed.shape !== "circle" && (!ed.box || ed.box.h == null && ed.box.height == null)) {
        const setRatio = () => { if (img.naturalWidth) rec.node.style.aspectRatio = img.naturalWidth + "/" + img.naturalHeight; };
        img.addEventListener("load", setRatio);
        if (img.complete) setRatio();
      } else {
        rec.inner.style.height = "100%";
      }
      if (ed.parallax) {
        // frame-parallax: image is taller than its frame and drifts inside it while scrolling
        const a = Math.abs(ed.parallax);
        rec.node.style.overflow = "hidden";
        img.style.height = `calc(100% + ${2 * a}%)`;
        img.style.position = "relative";
        img.style.top = `-${a}%`;
        img.style.willChange = "transform";
        rec.parallaxImg = img;
      }
      rec.inner.appendChild(img);
      rec.node.style.position = "absolute";
      if (ed.zoom != null ? ed.zoom : this.ex.theme.zoom) {
        // zoom: click opens the image full screen (see openLightbox)
        img.classList.add("zoomable");
        img.addEventListener("click", () => this.openLightbox(rec));
      }
      if (ed.caption) {
        // caption: a short visible line under the image (title, year, technique, size)
        const cap = h("p", "img-caption");
        this.typeStyle({ role: ed.captionRole || "caption", color: ed.captionColor }, cap);
        rec.node.appendChild(cap);
        rec.texts.push({ node: cap, value: ed.caption, rich: true });
      }
      if (ed.credit) this.creditButton(ed, rec);
    }

    /* credit: a small "i" at the image's corner; click opens the caption (title, author, source, licence, changes) */
    creditButton(ed, rec) {
      const b = h("button", "credit-i");
      b.type = "button";
      b.textContent = "i";
      b.setAttribute("aria-label", "Image credit");
      b.setAttribute("aria-expanded", "false");
      const panel = h("div", "credit-panel");
      panel.hidden = true;
      (Array.isArray(ed.credit) ? ed.credit : [ed.credit]).forEach((line) => {
        const pe = h("p", "credit-line");
        this.typeStyle({ role: "caption", color: ed.creditColor || "ink" }, pe);
        panel.appendChild(pe);
        rec.texts.push({ node: pe, value: line, rich: true });
      });
      const toggle = (open) => {
        panel.hidden = !open;
        b.classList.toggle("on", open);
        b.textContent = open ? "×" : "i";
        b.setAttribute("aria-expanded", String(open));
      };
      b.addEventListener("click", (e) => { e.stopPropagation(); toggle(panel.hidden); });
      document.addEventListener("click", (e) => { if (!panel.hidden && !panel.contains(e.target)) toggle(false); });
      // on the picture's own box, so the "i" stays in the image's corner when a caption makes the block taller (flow)
      rec.inner.appendChild(b);
      rec.inner.appendChild(panel);
    }

    build_rule(ed, rec) {
      rec.inner.style.background = this.color(ed.color || "white");
      rec.inner.style.height = "100%";
      rec.inner.style.width = "100%";
    }

    /* empty frame for an image to be added later; visible only in debug (D) */
    build_slot(ed, rec) {
      rec.node.classList.add("slot");
      rec.inner.style.height = "100%";
      rec.inner.textContent = ed.note || "image";
    }

    /* line: an SVG drawing (ed.paths: path data in ed.viewBox units). Pairs with the "draw" enter effect. */
    build_line(ed, rec) {
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("viewBox", ed.viewBox || "0 0 1000 1000");
      svg.setAttribute("preserveAspectRatio", ed.fit || "xMidYMid meet");
      svg.setAttribute("aria-hidden", "true");
      (ed.paths || []).forEach((d) => {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", typeof d === "string" ? d : d.d);
        p.setAttribute("fill", d && d.fill ? this.color(d.fill) : "none");
        p.setAttribute("stroke", d && d.fill && !d.stroke ? "none" : this.color((d && d.stroke) || ed.stroke || "ink"));
        p.setAttribute("stroke-width", (d && d.width) || ed.width || 2);
        p.setAttribute("stroke-linecap", "round");
        p.setAttribute("stroke-linejoin", "round");
        p.setAttribute("vector-effect", "non-scaling-stroke");
        svg.appendChild(p);
      });
      if (ed.clip) svg.style.overflow = "hidden"; // clip: true keeps the strokes inside the element's box
      rec.inner.style.height = "100%";
      rec.inner.appendChild(svg);
    }

    /* grid: thin column lines of the layout grid (Bauhaus: strict grid under the free line) */
    build_grid(ed, rec) {
      rec.node.classList.add("grid-lines");
      const n = ed.columns || 12;
      Object.assign(rec.node.style, { left: ed.margin || "4vw", right: ed.margin || "4vw", top: 0, bottom: 0, pointerEvents: "none" });
      Object.assign(rec.inner.style, { height: "100%", display: "grid", gridTemplateColumns: `repeat(${n}, 1fr)`, columnGap: ed.gutter || "1.6vw" });
      for (let i = 0; i < n; i++) {
        const c = h("div", "", { borderLeft: `1px solid ${this.color(ed.color || "ink")}`, borderRight: `1px solid ${this.color(ed.color || "ink")}`, opacity: ed.opacity != null ? ed.opacity : 0.06 });
        rec.inner.appendChild(c);
      }
    }

    /* button: pill-shaped, {text, goto, variant: "solid" | "link", color: theme colour (solid: fill, link: text + underline), arrow: true} */
    makeButton(it) {
      const v = it.variant || "solid";
      const b = h("a", "btn btn-" + v + " clickable");
      b.setAttribute("role", "button");
      b.tabIndex = 0;
      const c = this.color(it.color || (v === "link" ? "accent" : "ink"));
      b.style.setProperty("--btn-c", c);
      const label = h("span", "btn-label");
      this.typeStyle({ role: it.role || "button", color: "inherit" }, label);
      label.style.color = "";
      b.appendChild(label);
      if (it.arrow) b.appendChild(h("span", "btn-arrow")).textContent = "→";
      if (it.goto) {
        b.addEventListener("click", (e) => { e.stopPropagation(); this.go(it.goto); });
        b.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.stopPropagation(); this.go(it.goto); } });
      }
      return { node: b, label };
    }

    build_button(ed, rec) {
      const { node, label } = this.makeButton(Object.assign({}, ed, { goto: null }));
      rec.inner.appendChild(node);
      rec.texts.push({ node: label, value: ed.text });
    }

    /* buttons: a row of buttons, {items: [{text, goto, variant, color, arrow}], gap} */
    build_buttons(ed, rec) {
      Object.assign(rec.inner.style, { display: "flex", flexWrap: "wrap", alignItems: "center", gap: ed.gap || "2.2em" });
      (ed.items || []).forEach((it) => {
        const { node, label } = this.makeButton(it);
        rec.inner.appendChild(node);
        rec.texts.push({ node: label, value: it.text });
      });
    }

    /* route: a life drawn as one line. Across: time (years); up and down: a second value, e.g. latitude.
       {stops: [{label, note, year, value, side: "above" | "below", break: true}], end: {year, value},
        years: [from, to], values: [min, max], ticks: [years], vertical: false, current: stop index}
       A stop with break: true draws the segment leaving it (to the next stop) in the accent colour (a rupture).
       With enter {effect: "route"} the line draws itself and each stop appears as the line reaches it. */
    build_route(ed, rec) {
      const NS = "http://www.w3.org/2000/svg";
      const [y0, y1] = ed.years, [v0, v1] = ed.values;
      const vert = !!ed.vertical;
      // position in % of the box: time runs left→right (or top→bottom when vertical), value runs bottom→top (or left→right)
      const pos = (year, val) => {
        const t = (year - y0) / (y1 - y0), u = (val - v0) / (v1 - v0);
        return vert ? [u * 100, t * 100] : [t * 100, (1 - u) * 100];
      };
      const pts = ed.stops.map((st) => pos(st.year, st.value));
