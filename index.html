      if (ed.end) pts.push(pos(ed.end.year, ed.end.value));
      rec.node.classList.add("route");
      rec.inner.style.height = "100%";
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("viewBox", "0 0 100 100");
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-hidden", "true");
      rec.inner.appendChild(svg);
      // smooth segments between neighbouring points (Catmull-Rom → Bézier)
      const segs = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        segs.push([p1, c1, c2, p2]);
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", `M ${p1} C ${c1} ${c2} ${p2}`.replace(/,/g, " "));
        p.setAttribute("class", "route-seg");
        const rupture = ed.stops[i] && ed.stops[i].break;
        p.setAttribute("fill", "none");
        p.setAttribute("stroke", this.color(rupture ? ed.breakColor || "accent" : ed.stroke || "ink"));
        if (ed.mini && !rupture) p.style.stroke = "var(--chrome-fg)"; // the small map takes the screen's ink, light or dark
        p.setAttribute("stroke-width", ed.width || 2);
        p.setAttribute("stroke-linecap", "round");
        p.setAttribute("vector-effect", "non-scaling-stroke");
        svg.appendChild(p);
      }
      if (ed.mini) rec.node.classList.add("route-mini");
      if (ed.at != null) {
        // "you are here": a marker on the line at a year (value interpolated between the neighbouring stops)
        // exactly on the drawn curve: find the segment that spans the year, then solve the Bézier for that time
        const tAt = (pos(ed.at, v0)[vert ? 1 : 0]);
        const ax = vert ? 1 : 0;
        const bez = (sg, t) => [0, 1].map((j) => { const u = 1 - t; return u * u * u * sg[0][j] + 3 * u * u * t * sg[1][j] + 3 * u * t * t * sg[2][j] + t * t * t * sg[3][j]; });
        const sg = segs.find((q) => (q[0][ax] - tAt) * (q[3][ax] - tAt) <= 0) || segs[segs.length - 1];
        let lo = 0, hi = 1;
        const up = sg[3][ax] >= sg[0][ax];
        for (let it = 0; it < 30; it++) { const m = (lo + hi) / 2; if ((bez(sg, m)[ax] < tAt) === up) lo = m; else hi = m; }
        const [x, y] = bez(sg, (lo + hi) / 2);
        const here = h("div", "route-here");
        here.style.left = x + "%";
        here.style.top = y + "%";
        if (ed.atLabel) {
          const l = h("span", "route-here-label");
          this.typeStyle({ role: "caption", color: ed.atColor }, l);
          here.appendChild(l);
          rec.texts.push({ node: l, value: ed.atLabel, rich: true });
        }
        rec.inner.appendChild(here);
        // on the small map the label sits under the map, not next to the marker
        if (ed.mini && here.firstChild) { here.firstChild.classList.add("route-mini-label"); rec.inner.appendChild(here.firstChild); }
      }
      if (ed.mini) {
        ed.stops.forEach((st, i) => {
          const d = h("span", "route-stop route-mini-dot" + (st.break ? " rupture" : ""));
          d.style.left = pts[i][0] + "%";
          d.style.top = pts[i][1] + "%";
          rec.inner.insertBefore(d, rec.inner.querySelector(".route-here"));
        });
        return;
      }
      ed.stops.forEach((st, i) => {
        const [x, y] = pts[i];
        const stop = h("div", "route-stop" + (ed.current === i ? " current" : "") + (st.break ? " rupture" : ""));
        stop.style.left = x + "%";
        stop.style.top = y + "%";
        const side = st.side || (vert ? (x > 50 ? "left" : "right") : "above");
        stop.classList.add("side-" + side);
        stop.appendChild(h("span", "route-dot"));
        const lab = h("div", "route-label");
        const name = h("p", "route-name");
        this.typeStyle({ role: ed.labelRole || "label" }, name);
        lab.appendChild(name);
        rec.texts.push({ node: name, value: st.label });
        if (st.note) {
          const note = h("p", "route-note");
          this.typeStyle({ role: "caption" }, note);
          lab.appendChild(note);
          rec.texts.push({ node: note, value: st.note, rich: true });
        }
        stop.appendChild(lab);
        rec.inner.appendChild(stop);
      });
      if (ed.end && ed.end.label) {
        const [x, y] = pts[pts.length - 1];
        const endl = h("p", "route-end");
        this.typeStyle({ role: "caption" }, endl);
        Object.assign(endl.style, { left: x + "%", top: y + "%" });
        rec.inner.appendChild(endl);
        rec.texts.push({ node: endl, value: ed.end.label, rich: true });
      }
      // time axis
      (ed.ticks || []).forEach((yr) => {
        const [x, y] = pos(yr, v0);
        const t = h("span", "route-tick");
        this.typeStyle({ role: "caption" }, t);
        t.textContent = yr;
        if (vert) Object.assign(t.style, { left: "-0.5em", top: y + "%", transform: "translate(-100%, -50%)" });
        else Object.assign(t.style, { left: x + "%", top: "100%", transform: "translate(-50%, 1.2em)" });
        rec.inner.appendChild(t);
      });
    }

    /* counter: a number that counts up on enter (effect "count") with a line drawn under it.
       {value, decimals, prefix, suffix, label, underline: theme colour or false} */
    build_counter(ed, rec) {
      const num = h("div", "counter-num");
      this.typeStyle({ role: ed.role || "numeral", color: ed.color }, num);
      num.dataset.value = ed.value;
      num.dataset.decimals = ed.decimals || 0;
      num.dataset.prefix = ed.prefix || "";
      num.dataset.suffix = ed.suffix || "";
      num.textContent = FX.formatNumber(ed.value, ed.decimals || 0, ed.prefix, ed.suffix);
      rec.inner.appendChild(num);
      if (ed.underline !== false) {
        const NS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("class", "counter-line");
        svg.setAttribute("viewBox", "0 0 100 6");
        svg.setAttribute("preserveAspectRatio", "none");
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", "M 0 3 C 30 1.5, 70 4.5, 100 3");
        p.setAttribute("fill", "none");
        p.setAttribute("stroke", this.color(ed.underline || "accent"));
        p.setAttribute("stroke-width", 2);
        p.setAttribute("vector-effect", "non-scaling-stroke");
        svg.appendChild(p);
        rec.inner.appendChild(svg);
      }
      if (ed.label) {
        const l = h("p", "counter-label");
        this.typeStyle({ role: ed.labelRole || "caption", color: ed.labelColor }, l);
        rec.inner.appendChild(l);
        rec.texts.push({ node: l, value: ed.label, rich: true });
      }
    }

    /* sound: toggle for the whole exhibition. Off by default; the choice is remembered.
       As an element (type "sound") or, with ex.soundToggle, fixed in the chrome on every screen. */
    build_sound(ed, rec) {
      this.soundSwitch(rec.node, rec.inner, ed);
    }

    soundSwitch(node, inner, ed) {
      node.classList.add("sound-toggle", "clickable");
      node.setAttribute("role", "switch");
      node.tabIndex = 0;
      const mark = h("span", "sound-mark");
      const label = h("span", "sound-label");
      this.typeStyle({ role: ed.role || "label", color: ed.color }, label);
      if (!ed.color) label.style.color = "";
      inner.appendChild(mark);
      inner.appendChild(label);
      // speaker icon: shown instead of the dot and the words where there is no room (chrome toggle on phones)
      const icon = h("span", "sound-icon");
      icon.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="si-body" d="M3.5 9.2 H7.4 L12.6 4.8 V19.2 L7.4 14.8 H3.5 Z"/><path class="si-on" d="M15.6 9.1 C16.9 10.7 16.9 13.3 15.6 14.9 M18.4 6.6 C21.1 9.8 21.1 14.2 18.4 17.4"/><path class="si-off" d="M16 9.5 L21 14.5 M21 9.5 L16 14.5"/></svg>';
      inner.appendChild(icon);
      // both labels sit in one grid cell, so the switch keeps the width of the longer one and the dot never moves
      const offL = h("span", "sl-off"), onL = h("span", "sl-on");
      offL.textContent = this.tr(ed.off || "Sound off");
      onL.textContent = this.tr(ed.on || "Sound on");
      label.appendChild(offL);
      label.appendChild(onL);
      const show = () => {
        node.classList.toggle("on", this.sound);
        node.setAttribute("aria-checked", String(this.sound));
        node.setAttribute("aria-label", this.sound ? onL.textContent : offL.textContent);
      };
      const flip = () => {
        this.sound = !this.sound;
        try { localStorage.setItem("ex-sound", this.sound ? "1" : "0"); } catch (e) { /* ignore */ }
        window.dispatchEvent(new CustomEvent("ex-sound", { detail: this.sound }));
        document.querySelectorAll(".sound-toggle").forEach((n) => n._show && n._show());
        this.updateSound();
      };
      node._show = show;
      node.addEventListener("click", flip);
      node.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); flip(); } });
      show();
    }

    /* screen.sound {src, volume, loop, fadeIn, fadeOut}: plays while that screen is open and sound is on.
       Screens that share the same src keep it playing across them. */
    updateSound() {
      const s = this.current && this.current.def.sound;
      const want = this.sound && s ? s.src : null;
      if (this.audioSrc === want) return;
      const fade = (a, to, ms, done) => {
        cancelAnimationFrame(a._raf);
        const from = a.volume, t0 = performance.now();
        const step = (now) => {
          const k = ms ? Math.min(1, (now - t0) / ms) : 1;
          a.volume = Math.max(0, Math.min(1, from + (to - from) * k));
          if (k < 1) a._raf = requestAnimationFrame(step); else if (done) done();
        };
        a._raf = requestAnimationFrame(step);
      };
      if (this.audio) {
        const old = this.audio;
        fade(old, 0, (this.audioDef && this.audioDef.fadeOut) || 1200, () => old.pause());
      }
      this.audio = null;
      this.audioSrc = want;
      this.audioDef = s;
      if (!want) return;
      const a = new Audio(want);
      a.loop = s.loop !== false;
      a.volume = 0;
      a.play().then(() => fade(a, s.volume != null ? s.volume : 0.6, s.fadeIn || 2000)).catch(() => { /* blocked until the visitor interacts */ });
      this.audio = a;
    }

    /* list of big names; hovering a row shows its preview image in a fixed place */
    build_list(ed, rec, screenEl) {
      rec.targets = [];
      let preview = null;
      let pimg = null;
      if (ed.preview) {
        preview = h("div", "list-preview");
        const pb = ed.preview.box || {};
        Object.keys(pb).forEach((k) => { preview.style[BOX[k] || k] = pb[k]; });
        pimg = h("img");
        pimg.alt = "";
        preview.appendChild(pimg);
        screenEl.appendChild(preview);
      }
      (ed.items || []).forEach((it, i) => {
        const row = h("div", "list-item" + (it.goto ? " clickable" : ""));
        row.dataset.id = it.id;
        this.typeStyle({ role: ed.role || "title", color: ed.color, align: ed.align }, row);
        rec.texts.push({ node: row, value: it.label, rich: false });
        if (it.goto) {
          row.tabIndex = 0;
          row.addEventListener("click", () => this.go(it.goto));
          row.addEventListener("keydown", (e) => { if (e.key === "Enter") this.go(it.goto); });
        }
        if (preview && it.src) {
          const pre = new Image();
          pre.src = it.src;
          row.addEventListener("mouseenter", () => { pimg.src = it.src; preview.classList.add("on"); });
          row.addEventListener("mouseleave", () => preview.classList.remove("on"));
        }
        rec.inner.appendChild(row);
        rec.targets.push({ node: row, extra: i * (ed.stagger != null ? ed.stagger : 90) });
      });
    }

    /* blob-zoom: a full-screen image seen through a blob-shaped window. Scrolling zooms into the blob until
       its lobe fills the screen and the whole image is revealed. See FX.scrollFx["blob-zoom"].
       Built from two transformed layers (window scales up, image scales down by the same factor), so
       scrolling only changes transforms: no repaint, no jitter. */
    build_blobzoom(ed, rec) {
      const b = ed.blob;
      rec.blob = b;
      rec.node.style.cssText += ";left:0;top:0;width:100vw;height:100vh;pointer-events:none;overflow:hidden";
      rec.inner.style.height = "100%";
      const win = h("div", "bz-win");
      const m = `url("${b.mask}")`;
      win.style.webkitMaskImage = win.style.maskImage = m;
      win.style.webkitMaskRepeat = win.style.maskRepeat = "no-repeat";
      win.style.webkitMaskSize = win.style.maskSize = "100% 100%";
      const img = h("img", "bz-img");
      img.alt = ed.alt || "";
      img.src = ed.src;
      win.appendChild(img);
      rec.inner.appendChild(win);
      rec.bzWin = win;
      rec.bzImg = img;
      this.layoutBlob(rec);
      this.applyBlob(rec, 0);
    }

    layoutBlob(rec) {
      const b = rec.blob;
      const vw = innerWidth / 100;
      const vh = innerHeight / 100;
      const w0 = b.box.width * vw;
      rec.bzWin.style.width = w0 + "px";
      rec.bzWin.style.height = w0 * b.aspect + "px";
      rec.bzImg.style.left = -b.box.left * vw + "px";
      rec.bzImg.style.top = -b.box.top * vh + "px";
      rec.bzImg.style.width = innerWidth + "px";
      rec.bzImg.style.height = innerHeight + "px";
    }

    blobSample(rec, px) {
      const b = rec.blob;
      const vw = innerWidth / 100;
      const vh = innerHeight / 100;
      const [s0, s1] = b.range;
      const p = Math.min(Math.max((px / vh - s0) / (s1 - s0), 0), 1);
      const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; // easeInOutCubic
      const [fx, fy] = b.focal;
      const w0 = b.box.width * vw;
      const h0 = w0 * b.aspect;
      const w1 = (Math.hypot(innerWidth, innerHeight) / 2 * 1.08) / b.lobeR;
      const s = Math.pow(w1 / w0, e);
      const a0x = b.box.left * vw + fx * w0;
      const a0y = b.box.top * vh + fy * h0;
      const ax = a0x + (innerWidth / 2 - a0x) * e;
      const ay = a0y + (innerHeight / 2 - a0y) * e;
      const Tx = ax - s * fx * w0;
      const Ty = ay - s * fy * h0;
      const tx = -Tx / s + b.box.left * vw;
      const ty = -Ty / s + b.box.top * vh;
      return {
        win: `translate(${Tx}px, ${Ty}px) scale(${s})`,
        img: `matrix(${1 / s}, 0, 0, ${1 / s}, ${tx}, ${ty})`
      };
    }

    applyBlob(rec, px) {
      const f = this.blobSample(rec, px);
      rec.bzWin.style.transform = f.win;
      rec.bzImg.style.transform = f.img;
    }

    /* embed: an external page in a frame, e.g. an Instagram post (src = …/p/<id>/embed) */
    build_embed(ed, rec) {
      const f = h("iframe");
      f.src = ed.src;
      f.title = ed.alt || "";
      f.loading = "lazy";
      f.setAttribute("allowtransparency", "true");
      f.setAttribute("scrolling", "no");
      f.style.cssText = "display:block;width:100%;height:100%;border:0;background:#fff";
      rec.inner.style.height = "100%";
      rec.inner.appendChild(f);
    }

    /* walkthrough: the rooms of the exhibition side by side (photo + text), walked through from left to right
       while the screen scrolls down. Inside each photo the image lags behind (parallax) and comes slightly
       closer as the room reaches the middle; a counter and a progress line sit bottom left.
       Scroll-linked parts are driven from bindScroll (transform / opacity only). */
    build_walkthrough(ed, rec) {
      if (this.mobile) return this.walkList(ed, rec);
      const stage = h("div", "wt-stage");
      const strip = h("div", "wt-strip");
      stage.appendChild(strip);
      rec.inner.style.height = "100%"; // the sticky stage needs the full scroll length to stay pinned
      rec.inner.appendChild(stage);
      const text = (parent, cls, value, style) => {
        const p = h("p", "para" + (cls ? " " + cls : ""));
        this.typeStyle(style, p);
        parent.appendChild(p);
        rec.texts.push({ node: p, value, rich: true });
        return p;
      };
      const intro = h("div", "wt-intro", { width: ed.intro || "26vw", paddingLeft: "7vw" });
      intro.style.flexDirection = "column";
      intro.style.alignItems = "flex-start";
      intro.style.justifyContent = "center";
      intro.style.gap = "3vh";
      if (ed.introTitle) text(intro, "", ed.introTitle, { role: ed.introTitleRole || "title", color: ed.introColor || "light" });
      if (ed.introText) text(intro, "wt-intro-text", ed.introText, { role: "body", color: ed.introColor || "light" });
      if (ed.hint) text(intro, "", ed.hint, { role: ed.hintRole || "caption", color: "grey" });
      strip.appendChild(intro);
      const par = ed.parallax != null ? ed.parallax : 8;
      const rooms = (ed.items || []).map((it, i) => {
        const room = h("div", "wt-room", { display: "flex", marginRight: i < ed.items.length - 1 ? ed.gap || "10vw" : ed.tail || 0 });
        room.dataset.id = it.id;
        const frame = h("div", "wt-photo", { width: `calc(100vh * ${it.ratio || 4 / 3})` });
        let img;
        if (it.slides) {
          // slides: several photos in one frame; only the arrows change them (scrolling keeps walking)
          img = h("div", "wt-slides");
          const shots = it.slides.map((sl, k) => {
            const im = h("img", k ? "" : "on");
            im.src = sl.src;
            im.alt = sl.alt || "";
            img.appendChild(im);
            return im;
          });
          let cur = 0;
          const ctl = h("div", "wt-slide-ctl");
          const count = h("span", "wt-slide-count");
          this.typeStyle({ role: "label", color: "white" }, count);
          const go = (d) => {
            shots[cur].classList.remove("on");
            cur = (cur + d + shots.length) % shots.length;
            shots[cur].classList.add("on");
            count.textContent = `${cur + 1}/${shots.length}`;
          };
          const arrow = (t, d, aria) => { const b = h("button", "wt-slide-btn"); b.type = "button"; b.textContent = t; b.setAttribute("aria-label", aria); b.addEventListener("click", (e) => { e.stopPropagation(); go(d); }); return b; };
          ctl.appendChild(arrow("←", -1, "Previous photo"));
          ctl.appendChild(count);
          ctl.appendChild(arrow("→", 1, "Next photo"));
          go(0);
          frame.appendChild(ctl);
        } else {
          img = h("img");
          img.src = it.src;
          img.alt = it.alt || "";
        }
        img.style.width = `${100 + 2 * par}%`;
        img.style.left = `-${par}%`;
        frame.insertBefore(img, frame.firstChild);
        const panel = h("div", "wt-text", { width: ed.textWidth || "40vw", padding: ed.textPadding || "10vh 4vw 0 5vw" });
        if (it.artist) {
          const a = h("div", "wt-artist hover-underline" + (it.goto ? " clickable" : ""));
          text(a, "", it.artist, { role: "caption", color: "grey" });
          if (it.goto) a.addEventListener("click", () => this.go(it.goto));
          panel.appendChild(a);
        }
        (it.works || []).forEach((w, j) => {
          text(panel, "", w.title, { role: ed.titleRole || "lead", weight: 500, color: ed.titleColor || "light" }).style.marginTop = j ? "2vh" : 0;
          text(panel, "", w.medium, { role: ed.titleRole || "lead", weight: 500, color: "grey" });
        });
        panel.lastChild.classList.add("wt-medium");
        (it.paragraphs || []).forEach((p, j) => text(panel, j ? "indent" : "", p, { role: "body", color: "light" }));
        if (it.credits) {
          const c = h("div", "wt-credits");
          it.credits.forEach((p, j) => text(c, "", p, { role: "caption", color: "grey", italic: true }).style.marginTop = j ? "1.2em" : 0);
          panel.appendChild(c);
        }
        panel.addEventListener("scroll", () => this.walkFade(panel), { passive: true }); // only toggles the fades
        room.appendChild(frame);
        room.appendChild(panel);
        strip.appendChild(room);
        return { frame, img, panel };
      });
      const dotsNav = ed.nav === "dots";
      const hud = h("div", "wt-hud" + (dotsNav ? " wt-hud-dots" : ""));
      const labels = h("div", "wt-labels");
      const n = rooms.length;
      const labelNodes = (ed.items || []).map((it, i) => {
        const value = dotsNav ? it.artist : { en: `${String(i + 1).padStart(2, "0")} / ${String(n).padStart(2, "0")}   ${this.tr(it.artist)}` };
        const l = text(labels, "wt-label", value, { role: dotsNav ? "small" : "caption", color: "light" });
        l.style.whiteSpace = "pre";
        return l;
      });
      const bar = h("div", "wt-bar");
      const fill = h("div", "wt-bar-fill");
      bar.appendChild(fill);
      let dots = null;
      if (dotsNav) {
        // dots: one circle per room, the current one filled; click a circle to walk there
        const row = h("div", "wt-dots");
        dots = (ed.items || []).map((it, i) => {
          const d = h("button", "wt-dot");
          d.type = "button";
          d.setAttribute("aria-label", this.tr(it.artist));
          const f = h("span", "wt-dot-fill");
          d.appendChild(f);
          d.addEventListener("click", () => {
            const r = rooms[i], scr = rec.node.closest(".screen");
            if (!scr || r.x == null) return;
            scr.scrollTo({ top: Math.max(0, Math.min(rec.walk.travel, r.x + r.w / 2 - innerWidth / 2)), behavior: "smooth" });
          });
          row.appendChild(d);
          return f;
        });
        hud.appendChild(row);
        hud.appendChild(labels);
      } else {
        hud.appendChild(labels);
        hud.appendChild(bar);
      }
      if (ed.credit) text(hud, "", ed.credit, { role: "caption", color: "grey" }).style.marginTop = "10px";
      stage.appendChild(hud);
      rec.walk = { strip, rooms, labels: labelNodes, dots, fill, hud, par, tail: ed.tail, textBottom: ed.textBottom };
    }

    /* walkthrough on a phone: the rooms stacked one under another (photo, then text), scrolled normally */
    walkList(ed, rec) {
      rec.node.classList.add("wt-list");
      const text = (parent, value, style) => {
        const p = h("p", "para");
        this.typeStyle(style, p);
        parent.appendChild(p);
        rec.texts.push({ node: p, value, rich: true });
        return p;
      };
      const head = h("div", "wt-list-head");
      if (ed.introTitle) text(head, ed.introTitle, { role: "title", color: ed.introColor || "light" });
      if (ed.introText) text(head, ed.introText, { role: "body", color: ed.introColor || "light" });
      rec.inner.appendChild(head);
      (ed.items || []).forEach((it) => {
        const item = h("div", "wt-list-item");
        const img = h("img");
        img.src = it.src || (it.slides && it.slides[0].src);
        img.alt = it.alt || (it.slides && it.slides[0].alt) || "";
        item.appendChild(img);
        if (it.artist) text(item, it.artist, { role: "label", color: "grey" });
        (it.works || []).forEach((w) => { text(item, w.title, { role: "lead", weight: 500, color: ed.titleColor || "light" }); text(item, w.medium, { role: "body", color: "grey" }); });
        (it.paragraphs || []).forEach((p) => text(item, p, { role: "body", color: "light" }));
        (it.credits || []).forEach((p) => text(item, p, { role: "caption", color: "grey", italic: true }));
        rec.inner.appendChild(item);
      });
    }

    /* walkthrough geometry, measured whenever the screen is (re)bound: the screen scrolls exactly as far as the strip travels.
       Texts stay where they are while walking. A text longer than the space above the counter is cut off with a fade
       and scrolls by itself under the cursor (wheel over the text); once it is read, scrolling walks on. */
    layoutWalk(rec) {
      const w = rec.walk;
      const W = innerWidth;
      const H = innerHeight;
      // after the last room: black space so the walk ends with its text in the middle of the screen
      const lastRoom = w.rooms[w.rooms.length - 1];
      if (lastRoom && !w.tail) lastRoom.panel.parentNode.style.marginRight = Math.max(0, (W - lastRoom.panel.offsetWidth) / 2) + "px";
      w.travel = Math.max(w.strip.scrollWidth - W, 1);
      rec.node.style.height = w.travel + H + "px";
      // texts end above the counter (bottom left), or textBottom vh above the bottom of the screen
      const limit = w.textBottom != null ? H * (1 - w.textBottom / 100) : w.hud.offsetTop - H * 0.04;
      w.rooms.forEach((r) => {
        r.x = r.frame.offsetLeft;
        r.w = r.frame.offsetWidth;
        r.tx = r.panel.offsetLeft;
        r.panel.style.height = Math.round(limit) + "px";
        this.walkFade(r.panel);
      });
    }

    /* fade at the bottom while there is more text below, at the top once it has been scrolled */
    walkFade(panel) {
      panel.classList.toggle("more", panel.scrollTop + panel.clientHeight < panel.scrollHeight - 2);
      panel.classList.toggle("scrolled", panel.scrollTop > 2);
    }

    build_cards(ed, rec) {
      const cols = ed.cols || 4;
      rec.inner.style.display = "grid";
      rec.inner.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      rec.inner.style.gap = ed.gap || "2vw";
      rec.targets = [];
      (ed.items || []).forEach((it, i) => {
        const card = h("div", "card" + (it.goto ? " clickable" : ""));
        card.dataset.id = it.id;
        if (it.hover || ed.hover) card.classList.add("hover-" + (it.hover || ed.hover));
        if (it.goto) {
          card.tabIndex = 0;
          card.addEventListener("click", () => this.go(it.goto));
          card.addEventListener("keydown", (e) => { if (e.key === "Enter") this.go(it.goto); });
        }
        if (it.src) {
          const wrap = h("div", "card-img");
          const img = h("img");
          img.src = it.src;
          img.alt = "";
          wrap.appendChild(img);
          card.appendChild(wrap);
        }
        const label = h("div", "card-label");
        this.typeStyle({ role: ed.role || "caption", color: ed.color, align: ed.align }, label);
        card.appendChild(label);
        rec.texts.push({ node: label, value: it.label, rich: false });
        rec.inner.appendChild(card);
        rec.targets.push({ node: card, extra: i * (ed.stagger != null ? ed.stagger : 90) });
      });
    }

    /* ---------- language ---------- */
    refreshLang() {
      this.screens.forEach((s) =>
        s.elements.forEach((e) =>
          e.texts.forEach((t) => {
            const v = this.tr(t.value);
            if (t.rich) t.node.innerHTML = md(v);
            else t.node.textContent = v;
          })
        )
      );
      this.ticks.querySelectorAll(".tick[data-nav]").forEach((b) => {
        const label = this.tr(this.ex.nav[b.dataset.nav].label);
        b.querySelector(".tick-label").textContent = label;
        b.setAttribute("aria-label", label);
      });
      if (this.langBtn) {
        this.langBtn.querySelectorAll(".lang-b").forEach((b) => b.classList.toggle("on", b.dataset.lang === this.lang));
      }
      document.documentElement.lang = this.lang;
    }

    setLang(l) {
      this.lang = l;
      try { localStorage.setItem("ex-lang", l); } catch (e) { /* ignore */ }
      this.refreshLang();
      if (this.current && this.current.def.scroll) this.bindScroll(this.current); // text lengths changed
    }

    /* ---------- navigation ---------- */
    bindInput() {
      let lastWheel = 0;
      window.addEventListener("wheel", (e) => {
        if (this.lb) return; // the lightbox handles its own wheel
        const c = this.current;
        if (c && c.sideways && Math.abs(e.deltaX) > Math.abs(e.deltaY)) { e.preventDefault(); c.el.scrollTop += e.deltaX; return; }
        if (c && c.def.scroll && e.deltaY) {
          const el = c.el;
          const dir = e.deltaY > 0 ? 1 : -1;
          const atEnd = dir > 0 ? el.scrollTop + el.clientHeight >= el.scrollHeight - 2 : el.scrollTop <= 0;
          if (!atEnd || this.scrollsInner(e.target, el, dir)) { this.edgePush = 0; return; } // still content: let it scroll natively
          // at the edge: no rubber-band bounce; keep scrolling a little further and the next screen comes
          e.preventDefault();
          if (this.edgeDir !== dir) { this.edgeDir = dir; this.edgePush = 0; }
          this.edgePush = (this.edgePush || 0) + Math.abs(e.deltaY);
          if (this.busy || this.edgePush < 120) return;
          this.edgePush = 0;
          lastWheel = Date.now();
          this.step(dir);
          return;
        }
        e.preventDefault();
        const now = Date.now();
        if (this.busy || now - lastWheel < 700 || Math.abs(e.deltaY) < 12) return;
        lastWheel = now;
        this.step(e.deltaY > 0 ? 1 : -1);
      }, { passive: false });
      window.addEventListener("keydown", (e) => {
        if (this.lb) return;
        const side = this.current && this.current.sideways;
        const down = ["ArrowDown", "PageDown", " "].includes(e.key) || (side && e.key === "ArrowRight");
        const up = ["ArrowUp", "PageUp"].includes(e.key) || (side && e.key === "ArrowLeft");
        if (down || up) {
          e.preventDefault();
          const dir = down ? 1 : -1;
          if (this.scrollsInside(dir)) this.current.el.scrollBy({ top: dir * innerHeight * 0.6, behavior: "smooth" });
          else this.step(dir);
        }
        else if (e.key === "d" || e.key === "D") document.body.classList.toggle("debug");
      });
      // touch: on a long screen, a swipe that STARTS at its end (or top) goes on at once; a swipe that only scrolls to the end does not
      let ty = null, edge = null;
      window.addEventListener("touchstart", (e) => {
        ty = e.touches[0].clientY;
        const c = this.current, el = c && c.def.scroll ? c.el : null;
        edge = el ? { top: el.scrollTop <= 2, bottom: el.scrollTop + el.clientHeight >= el.scrollHeight - 2 } : null;
      }, { passive: true });
      window.addEventListener("touchend", (e) => {
        if (ty == null || this.lb) return;
        const dy = ty - e.changedTouches[0].clientY;
        ty = null;
        if (Math.abs(dy) <= 50) return;
        const go = edge ? (dy > 0 ? edge.bottom : edge.top) : !this.scrollsInside(dy);
        if (go) this.step(dy > 0 ? 1 : -1);
      });
      const rebind = () => { if (this.current && this.current.def.scroll) this.bindScroll(this.current); };
      window.addEventListener("resize", rebind);
      // text heights change once the web fonts arrive: measure scroll lengths again
      if (document.fonts) document.fonts.addEventListener("loadingdone", rebind);
      window.addEventListener("hashchange", () => {
        const id = location.hash.slice(1);
        if (this.byId[id] && (!this.current || this.current.def.id !== id)) this.go(id, { noHash: true });
      });
    }

    /* true if the wheel is over a scrollable block inside the screen (e.g. a long walkthrough text) that can still move in `dir` */
    scrollsInner(node, screenEl, dir) {
      for (let n = node; n && n !== screenEl && n.nodeType === 1; n = n.parentNode) {
        if (n.scrollHeight > n.clientHeight + 2 && /auto|scroll/.test(getComputedStyle(n).overflowY)) {
          if (dir > 0 ? n.scrollTop + n.clientHeight < n.scrollHeight - 2 : n.scrollTop > 0) return true;
        }
      }
      return false;
    }

    /* scrollable screen (def.scroll): true while there is still content in direction `dir`.
       At the edge, the next screen is reached only after a short pause, so a fling doesn't skip past. */
    scrollsInside(dir) {
      const c = this.current;
      if (!c || !c.def.scroll || !dir) return false;
      const el = c.el;
      const atEnd = dir > 0 ? el.scrollTop + el.clientHeight >= el.scrollHeight - 2 : el.scrollTop <= 0;
      if (!atEnd) { this.edgeAt = 0; return true; }
      const now = Date.now();
      if (!this.edgeAt) this.edgeAt = now;
      return now - this.edgeAt < 450;
    }

    step(dir) {
      if (this.busy || !this.current) return;
      const lin = this.track(this.trackName(this.current));
      const i = lin.indexOf(this.current);
      const next = lin[i + dir];
      if (next) this.go(next.def.id);
      else if (dir < 0 && this.current.def.infoPage) this.openInfo(); // top of an info page: Up goes back, like ×
      else if (dir < 0 && this.current.def.back) this.go(this.current.def.back); // first screen of a sub-track: Up returns
    }

    async go(id, opts) {
      opts = opts || {};
      const target = this.byId[id];
      if (!target || this.busy || target === this.current) return;
      this.busy = true;
      const prev = this.current;
      if (prev) await this.leave(prev);
      this.current = target;
      if (!opts.noHash) { try { history.replaceState(null, "", "#" + id); } catch (e) { /* file:// */ } }
      this.idLabel.textContent = "screen: " + id;
      if (!prev || this.trackName(prev) !== this.trackName(target)) this.renderTicks(this.trackName(target));
      clearTimeout(this.sceneTimer);
      if (this.infoBtn) this.infoBtn.classList.remove("during-scene");
      this.updateInfo(target);
      const ni = this.navIndex(target);
      this.ticks.querySelectorAll(".tick").forEach((t) => t.classList.toggle("on", this.ex.nav ? +t.dataset.nav === ni : t.dataset.id === id));
      this.updateSound();
      if (target.def.line && !opts.instant) this.lineAcross(target.def.line);
      const dur = this.enter(target);
      setTimeout(() => { this.busy = false; }, Math.min(dur, 1200));
    }

    /* lightbox: one image full screen. Wheel / + − / double-click zoom, drag to move around the image,
       ← → (keys, buttons, swipe when not zoomed) step through all zoomable images of the current screen, Esc or × closes. */
    openLightbox(rec) {
      if (this.lb) return;
      const list = this.current.elements.filter((e) => e.def.type === "image" && e.node.querySelector("img.zoomable") && e.node.style.display !== "none");
      let i = Math.max(0, list.indexOf(rec));
      const lb = h("div", "lb");
      lb.setAttribute("role", "dialog");
      lb.setAttribute("aria-modal", "true");
      const stage = h("div", "lb-stage");
      const img = h("img", "lb-img");
      img.draggable = false;
      stage.appendChild(img);
      const bar = h("div", "lb-bar");
      const info = h("div", "lb-info");
      const cap = h("p", "lb-caption");
      this.typeStyle({ role: "caption", color: "ink" }, cap);
      const cred = h("div", "lb-credit");
      const txt = h("p", "lb-text");
      this.typeStyle({ role: "body", color: "ink" }, txt);
      info.appendChild(txt);
      info.appendChild(cap);
      info.appendChild(cred);
      const ctr = h("div", "lb-controls");
      // icons are drawn (SVG), not typed: font glyphs sit off-centre in a circle and are too thin
      const ICON = {
        prev: "M19 12H5M11 6l-6 6 6 6",
        next: "M5 12h14M13 6l6 6-6 6",
        out: "M6 12h12",
        in: "M6 12h12M12 6v12",
        close: "M6.5 6.5l11 11M17.5 6.5l-11 11"
      };
      const btn = (icon, aria, fn) => {
        const b = h("button", "lb-btn"); b.type = "button"; b.setAttribute("aria-label", aria);
        b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[icon]}"/></svg>`;
        b.addEventListener("click", (e) => { e.stopPropagation(); fn(); }); ctr.appendChild(b); return b;
      };
      const count = h("span", "lb-count");
      this.typeStyle({ role: "label" }, count);
      const prev = btn("prev", "Previous image", () => show(i - 1));
      ctr.appendChild(count);
      const next = btn("next", "Next image", () => show(i + 1));
      btn("out", "Zoom out", () => zoomAt(z.s / 1.5));
      btn("in", "Zoom in", () => zoomAt(z.s * 1.5));
      btn("close", "Close", () => close());
      bar.appendChild(info);
      bar.appendChild(ctr);
      lb.appendChild(stage);
      lb.appendChild(bar);
      document.body.appendChild(lb);
      this.lb = lb;

      const z = { s: 1, x: 0, y: 0 };
      const apply = (smooth) => {
        img.style.transition = smooth ? "transform .35s cubic-bezier(.16,1,.3,1)" : "none";
        img.style.transform = `translate(${z.x}px, ${z.y}px) scale(${z.s})`;
        lb.classList.toggle("zoomed", z.s > 1.01);
      };
      const clamp = () => {
        const r = stage.getBoundingClientRect();
        const mx = Math.max(0, (img.offsetWidth * z.s - r.width) / 2), my = Math.max(0, (img.offsetHeight * z.s - r.height) / 2);
        z.x = Math.min(mx, Math.max(-mx, z.x));
        z.y = Math.min(my, Math.max(-my, z.y));
      };
      // zoom keeping the point under (cx, cy) in place; without a point, around the centre
      const zoomAt = (s, cx, cy, instant) => {
        const r = stage.getBoundingClientRect();
        const ns = Math.min(6, Math.max(1, s));
        const px = (cx != null ? cx : r.left + r.width / 2) - (r.left + r.width / 2);
        const py = (cy != null ? cy : r.top + r.height / 2) - (r.top + r.height / 2);
        z.x = px - (px - z.x) * (ns / z.s);
        z.y = py - (py - z.y) * (ns / z.s);
        z.s = ns;
        if (ns === 1) { z.x = 0; z.y = 0; }
        clamp();
        apply(!instant);
      };
      const show = (k) => {
        i = (k + list.length) % list.length;
        const d = list[i].def;
        img.src = d.zoomSrc || d.src;
        img.alt = this.tr(d.alt) || "";
        cap.innerHTML = md(this.tr(d.caption || ""));
        txt.innerHTML = d.text ? md(this.tr(d.text)) : "";
        txt.hidden = !d.text;
        cred.innerHTML = "";
        (Array.isArray(d.credit) ? d.credit : d.credit ? [d.credit] : []).forEach((line) => {
          const pe = h("p", "lb-credit-line");
          this.typeStyle({ role: "caption" }, pe);
          pe.innerHTML = md(this.tr(line));
          cred.appendChild(pe);
        });
        count.textContent = `${i + 1} / ${list.length}`;
        prev.hidden = next.hidden = list.length < 2;
        z.s = 1; z.x = 0; z.y = 0;
        apply(false);
      };
      const close = () => {
        lb.remove();
        this.lb = null;
        document.removeEventListener("keydown", onKey, true);
        if (list[i]) { const t = list[i].node.querySelector("img"); if (t) t.focus && t.focus({ preventScroll: true }); }
      };
      const onKey = (e) => {
        if (e.key === "Escape") close();
        else if (e.key === "ArrowRight") show(i + 1);
        else if (e.key === "ArrowLeft") show(i - 1);
        else if (e.key === "+" || e.key === "=") zoomAt(z.s * 1.5);
        else if (e.key === "-") zoomAt(z.s / 1.5);
        else return;
        e.preventDefault();
        e.stopPropagation();
      };
      document.addEventListener("keydown", onKey, true);
      lb.addEventListener("wheel", (e) => { e.preventDefault(); e.stopPropagation(); zoomAt(z.s * Math.exp(-e.deltaY * 0.0025), e.clientX, e.clientY); }, { passive: false });
      img.addEventListener("dblclick", (e) => { if (!touchTap) zoomAt(z.s > 1.01 ? 1 : 2.5, e.clientX, e.clientY); });
      // pointers: one (mouse, pen, finger) drags the zoomed image, or swipes sideways to the next image when not zoomed;
      // two fingers pinch-zoom around their midpoint; a double tap zooms in / back out (phones have no dblclick to rely on)
      const pts = new Map();
      let drag = null, pinch = null, lastTap = null, touchTap = false;
      const two = () => { const [a, b] = [...pts.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
      stage.addEventListener("pointerdown", (e) => {
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        try { stage.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone */ }
        if (pts.size === 2) { const t = two(); pinch = { d: t.d, s: z.s }; drag = null; return; }
        drag = { x: e.clientX, y: e.clientY, zx: z.x, zy: z.y, moved: false, onEmpty: e.target === stage };
      });
      stage.addEventListener("pointermove", (e) => {
        if (!pts.has(e.pointerId)) return;
        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pinch && pts.size === 2) { const t = two(); zoomAt(pinch.s * t.d / pinch.d, t.x, t.y, true); return; }
        if (!drag) return;
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
        if (z.s > 1.01) { z.x = drag.zx + dx; z.y = drag.zy + dy; clamp(); apply(false); }
      });
      const up = (e) => {
        pts.delete(e.pointerId);
        if (pinch) { if (pts.size === 0) pinch = null; drag = null; return; } // a pinch never ends in a swipe or a tap
        if (!drag) return;
        const dx = e.clientX - drag.x;
        touchTap = e.pointerType === "touch";
        if (z.s <= 1.01 && Math.abs(dx) > 60) show(i + (dx < 0 ? 1 : -1));
        else if (!drag.moved && touchTap && !drag.onEmpty) {
          const now = Date.now();
          if (lastTap && now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 40) {
            zoomAt(z.s > 1.01 ? 1 : 2.5, e.clientX, e.clientY); lastTap = null;
          } else lastTap = { t: now, x: e.clientX, y: e.clientY };
        }
        else if (!drag.moved && drag.onEmpty) close(); // a click on the empty area closes
        drag = null;
      };
      stage.addEventListener("pointerup", up);
      stage.addEventListener("pointercancel", up);
      ["touchstart", "touchend"].forEach((t) => lb.addEventListener(t, (e) => e.stopPropagation(), { passive: true }));
      show(i);
      lb.animate([{ opacity: 0 }, { opacity: 1 }], { duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 300, easing: "ease-out" });
      ctr.querySelector(".lb-btn:last-child").focus({ preventScroll: true });
    }

    /* line transition (screen.line): one free line runs across the screen while the next screen comes in,
       drawn in from its start and let go at its end. line: true | {d, color, width, duration, viewBox} */
    lineAcross(opt) {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const o = opt === true ? {} : opt;
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("class", "line-across");
      svg.setAttribute("viewBox", o.viewBox || "0 0 1000 600");
      svg.setAttribute("preserveAspectRatio", "none");
      const d = o.d || "M -20 470 C 180 470, 260 300, 420 300 S 640 520, 780 380 S 940 140, 1020 120";
      const pencil = o.pencil != null ? o.pencil : this.ex.theme.pencil;
      // the noise filter is redrawn on every frame of the stroke: too heavy for phones, the line stutters there.
      // On phones the pencil keeps only its second, fainter stroke.
      const rough = pencil && !this.mobile;
      if (rough) {
        // pencil: the edge of the stroke is roughened by a little noise, and a fainter second stroke runs beside it
        const defs = document.createElementNS(NS, "defs");
        defs.innerHTML = '<filter id="lx-pencil" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="' + Math.floor(Math.random() * 99) + '" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter>';
        svg.appendChild(defs);
      }
      const strokes = pencil ? [{ w: (o.width || 2) * 1.1, op: 0.85, dy: 0 }, { w: (o.width || 2) * 0.6, op: 0.4, dy: 1.6 }] : [{ w: o.width || 2, op: 1, dy: 0 }];
      const paths = strokes.map((st) => {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", d);
        p.setAttribute("fill", "none");
        p.setAttribute("stroke", this.color(o.color || this.ex.theme.lineColor || "ink"));
        p.setAttribute("stroke-width", st.w);
        p.setAttribute("stroke-opacity", st.op);
        p.setAttribute("stroke-linecap", "round");
        p.setAttribute("vector-effect", "non-scaling-stroke");
        if (st.dy) p.setAttribute("transform", `translate(0 ${st.dy})`);
        if (rough) p.setAttribute("filter", "url(#lx-pencil)");
        svg.appendChild(p);
        return p;
      });
      document.body.appendChild(svg);
      const D = o.duration || this.ex.theme.lineDuration || 2400;
      const anims = paths.map((p, k) => {
        const L = FX.dashLength(p);
        p.style.strokeDasharray = L + " " + L;
        return p.animate(
          [{ strokeDashoffset: L, offset: 0 }, { strokeDashoffset: 0, offset: 0.55 }, { strokeDashoffset: -L, offset: 1 }],
          { duration: D, delay: k * 60, easing: "cubic-bezier(.55,0,.35,1)", fill: "both" }
        );
      });
      Promise.all(anims.map((a) => a.finished)).then(() => svg.remove()).catch(() => svg.remove());
    }

    setBg(color, ms) {
      this.stage.style.transition = `background-color ${ms}ms ease`;
      this.stage.style.backgroundColor = this.color(color);
    }

    /* returns approx. ms until the screen has settled */
    enter(rec) {
      const def = rec.def;
      rec.el.hidden = false;
      rec.el.scrollTop = 0;
      this.edgeAt = 0;
      this.edgePush = 0;
      rec.el.getAnimations({ subtree: true }).forEach((a) => a.cancel());
      this.setBg(def.bg || this.ex.theme.bg || "black", def.bgMs || 900);
      if (def.reveal && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        // reveal: the screen opens from a small circle or square in the middle and grows over the whole screen.
        // revealAt: where the circle starts, e.g. "0% 100%" (bottom left corner); from a corner it has to grow to the far corner.
        const at = def.revealAt || "50% 50%";
        const far = at === "50% 50%" ? "75%" : "150%";
        const from = def.reveal === "square" ? "inset(46% 46% 46% 46%)" : `circle(2% at ${at})`;
        const to = def.reveal === "square" ? "inset(0% 0% 0% 0%)" : `circle(${far} at ${at})`;
        rec.el.animate([{ clipPath: from }, { clipPath: to }], { duration: def.revealMs || 1400, easing: "cubic-bezier(.65,0,.35,1)" });
      }
      // chrome (menu squares, labels) takes the screen's ink colour, so it reads on light and dark screens
      const rs = document.documentElement.style;
      rs.setProperty("--chrome-fg", this.color(def.ink || this.ex.theme.ink || "white"));
      rs.setProperty("--chrome-bg", this.color(def.bg || this.ex.theme.bg || "black"));
      this.ticks.classList.toggle("hidden", def.nav === false);
      let sceneTotal = 0;
      let longest = 0;
      if (def.scene) {
        const sc = FX.scenes[def.scene.effect];
        if (sc) {
          rec.scene = sc.run(rec.el, def.scene, { lang: () => this.lang, setBg: (c, ms) => this.setBg(c, ms) });
          sceneTotal = rec.scene.total;
          // the info bubble waits until a whole-screen scene (e.g. the elevator) has played
          if (this.infoBtn) {
            this.infoBtn.classList.add("during-scene");
            clearTimeout(this.sceneTimer);
            this.sceneTimer = setTimeout(() => this.infoBtn.classList.remove("during-scene"), sceneTotal);
          }
        }
      }
      rec.elements.forEach((e) => {
        const steps = e.def.enter;
        if (!steps) return;
        if (e.def.reveal === "scroll") { this.observeReveal(rec, e); return; }
        const first = Array.isArray(steps) ? steps[0] : steps;
        const base = first.after === "scene" ? sceneTotal : 0;
        e.targets.forEach((t) => {
          FX.run(t.node, steps, "in", base + t.extra);
          const tm = FX.timing(first);
          longest = Math.max(longest, base + t.extra + tm.delay + tm.duration);
        });
      });
      if (def.scroll) this.bindScroll(rec);
      return Math.max(longest, 600);
    }

    /* reveal: "scroll" — each target (e.g. each paragraph) plays its enter when it scrolls into view */
    observeReveal(rec, e) {
      if (!rec.io) {
        rec.io = new IntersectionObserver((entries) => {
          entries.forEach((en) => {
            if (!en.isIntersecting) return;
            const t = en.target;
            rec.io.unobserve(t);
            t.style.opacity = "";
            FX.run(t, t._steps, "in", 0);
          });
        }, { root: rec.el, threshold: 0.2 });
      }
      e.targets.forEach((t) => {
        t.node.style.opacity = "0";
        t.node._steps = e.def.enter;
        rec.io.observe(t.node);
      });
    }

    /* ALL scroll-linked effects (scrub, blob-zoom, frame-parallax) go through bindScroll.
       Where the browser supports it they run on a ScrollTimeline: the browser itself plays them in step
       with the scroll position, on the compositor, so nothing lags behind the page (no jitter).
       Otherwise they are applied from a scroll listener (fallback, still transform/opacity only).
       New scroll effects must be added here, never as ad-hoc scroll handlers. */
    bindScroll(rec) {
      (rec.links || []).forEach((l) => l.anim && l.anim.cancel());
      rec.links = [];
      const el = rec.el;
      const vh = innerHeight / 100;
      const maxScroll = () => Math.max(el.scrollHeight - el.clientHeight, 1);
      const useST = typeof ScrollTimeline !== "undefined";
      const timeline = () => new ScrollTimeline({ source: el, axis: "block" });
      const range = (start, end) => ({ rangeStart: start + "px", rangeEnd: end + "px" });

      /* sampled: sampler(px) -> {cssProp: value}; sampled into keyframes over [start, end] px of scrolling */
      const sampled = (node, sampler, start, end, n) => {
        const link = { apply: (px) => Object.assign(node.style, sampler(px)) };
        if (useST) {
          try {
            const N = n || 64;
            const frames = [];
            for (let i = 0; i <= N; i++) frames.push(Object.assign({ offset: i / N }, sampler(start + ((end - start) * i) / N)));
            const a = node.animate(frames, Object.assign({ timeline: timeline(), fill: "both", easing: "linear" }, range(start, end)));
            if (a.rangeStart === undefined) throw new Error("no range support");
            link.anim = a;
          } catch (err) { link.anim = null; }
        }
        rec.links.push(link);
      };

      /* frames: author-written keyframes (scrub) */
      const framed = (node, sc) => {
        const start = sc.start * vh;
        const end = sc.end * vh;
        const link = {};
        if (useST) {
          try {
            const a = node.animate(sc.frames, Object.assign({ timeline: timeline(), fill: "both", easing: sc.ease || "linear" }, range(start, end)));
            if (a.rangeStart === undefined) throw new Error("no range support");
            link.anim = a;
          } catch (err) { link.anim = null; }
        }
        if (!link.anim) {
          const a = node.animate(sc.frames, { duration: 1000, easing: sc.ease || "linear", fill: "both" });
          a.pause();
          link.fallbackAnim = a;
          link.apply = (px) => { a.currentTime = Math.min(Math.max((px - start) / (end - start), 0), 1) * 1000; };
        }
        rec.links.push(link);
      };

      rec.elements.forEach((e) => {
        if (e.def.scrub) framed(e.node, e.def.scrub);
        if (e.def.scrubDraw) {
          // scrubDraw {start, end} (vh of scrolling): a line element's strokes draw themselves as the screen scrolls
          e.node.querySelectorAll("path").forEach((p) => {
            const L = FX.dashLength(p);
            p.style.strokeDasharray = L + " " + L;
            framed(p, { start: e.def.scrubDraw.start, end: e.def.scrubDraw.end, ease: e.def.scrubDraw.ease, frames: [{ strokeDashoffset: L }, { strokeDashoffset: 0 }] });
          });
        }
        if (e.walk) {
          const w = e.walk;
          this.layoutWalk(e);
          const W = innerWidth;
          const T = w.travel;
          const N = Math.min(400, Math.max(64, Math.round(T / 20)));
          const clamp = (v) => Math.min(Math.max(v, 0), 1);
          sampled(w.strip, (px) => ({ transform: `translateX(${-px}px)` }), 0, T, 2);
          w.rooms.forEach((r, i) => {
            sampled(r.img, (px) => {
              // -1 … 1: photo centre from the right edge of the screen to the left one
              const p = Math.min(Math.max((r.x + r.w / 2 - px - W / 2) / (W / 2 + r.w / 2), -1), 1);
              return { transform: `translateX(${(-p * w.par / 100) * r.w}px) scale(${1 + 0.05 * (1 - Math.abs(p))})` };
            }, 0, T, N);
            sampled(r.panel, (px) => ({ opacity: clamp((W - (r.tx - px)) / (W * 0.3)) }), 0, T, N);
            const next = w.rooms[i + 1];
            const fade = W * 0.06;
            const here = (px) => {
              const c = px + W / 2;
              return { opacity: (i ? clamp((c - r.x) / fade) : 1) * (next ? 1 - clamp((c - next.x) / fade) : 1) };
            };
            sampled(w.labels[i], here, 0, T, N);
            if (w.dots) sampled(w.dots[i], here, 0, T, N);
          });
          sampled(w.fill, (px) => ({ transform: `scaleX(${px / T})` }), 0, T, 2);
        }
        if (e.blob) {
          this.layoutBlob(e);
          const [s0, s1] = e.blob.range;
          const start = s0 * vh;
          const end = s1 * vh;
          const lw = { apply: (px) => this.applyBlob(e, px) };
          rec.links.push(lw);
          if (useST) {
            try {
              const N = 64;
              const fw = [];
              const fi = [];
              for (let i = 0; i <= N; i++) {
                const f = this.blobSample(e, start + ((end - start) * i) / N);
                fw.push({ offset: i / N, transform: f.win });
                fi.push({ offset: i / N, transform: f.img });
              }
              const opt = Object.assign({ timeline: timeline(), fill: "both", easing: "linear" }, range(start, end));
              const a1 = e.bzWin.animate(fw, opt);
              const a2 = e.bzImg.animate(fi, Object.assign({}, opt, { timeline: timeline() }));
              if (a1.rangeStart === undefined) throw new Error("no range support");
              lw.anim = { cancel() { a1.cancel(); a2.cancel(); } };
            } catch (err) { lw.anim = null; }
          }
          if (!lw.anim) this.applyBlob(e, el.scrollTop);
        }
        if (e.parallaxImg) {
          const node = e.node;
          const par = e.def.parallax;
          const sampler = (px) => {
            const H = innerHeight;
            const hh = node.offsetHeight;
            // -1 … 1: frame centre from the bottom of the viewport to the top
            const p = Math.min(Math.max((node.offsetTop - px + hh / 2 - H / 2) / (H / 2 + hh / 2), -1), 1);
            return { transform: `translateY(${(-p * par / 100) * hh}px)` };
          };
          const end = maxScroll();
          const link = { apply: (px) => Object.assign(e.parallaxImg.style, sampler(px)) };
          if (useST) {
            try {
              const N = 64;
              const frames = [];
              for (let i = 0; i <= N; i++) frames.push(Object.assign({ offset: i / N }, sampler((end * i) / N)));
              const a = e.parallaxImg.animate(frames, Object.assign({ timeline: timeline(), fill: "both", easing: "linear" }, range(0, end)));
              if (a.rangeStart === undefined) throw new Error("no range support");
              link.anim = a;
            } catch (err) { link.anim = null; }
          }
          rec.links.push(link);
          if (!link.anim) link.apply(el.scrollTop);
        }
      });
      if (!useST || rec.links.some((l) => !l.anim)) this.onScroll(rec);
    }

    /* fallback only: runs the effects that could not be put on a ScrollTimeline */
    onScroll(rec) {
      const st = rec.el.scrollTop;
      (rec.links || []).forEach((l) => { if (!l.anim && l.apply) l.apply(st); });
    }

    async leave(rec) {
      const def = rec.def;
      let longest = 0;
      const ps = [];
      rec.elements.forEach((e) => {
        if (!e.def.exit) return;
        e.targets.forEach((t) => {
          ps.push(FX.run(t.node, e.def.exit, "out", 0));
        });
        const first = Array.isArray(e.def.exit) ? e.def.exit[0] : e.def.exit;
        const tm = FX.timing(first);
        longest = Math.max(longest, tm.delay + tm.duration);
      });
      const screenExit = rec.el.animate([{ opacity: 1 }, { opacity: 0 }], {
        duration: (def.exit && def.exit.duration) || 500,
        delay: 0,
        easing: "ease-in",
        fill: "both"
      });
      ps.push(screenExit.finished);
      if (rec.scene && rec.scene.cancel) rec.scene.cancel();
      await Promise.all(ps);
      rec.el.hidden = true;
      rec.el.getAnimations({ subtree: true }).forEach((a) => a.cancel());
      rec.el.querySelectorAll(".fx-tiles").forEach((n) => n.remove());
      rec.el.querySelectorAll("img").forEach((i) => { i.style.visibility = ""; });
      rec.el.querySelectorAll(".list-preview.on").forEach((p) => p.classList.remove("on"));
      if (rec.io) { rec.io.disconnect(); rec.io = null; }
      rec.elements.forEach((e) => {
        if (e.def.reveal === "scroll") e.targets.forEach((t) => { t.node.style.opacity = ""; });
      });
    }
  }

  g.Engine = Engine;
})(window);

</script>
  <script>new Engine(document.getElementById("root"), window.EXHIBITION);</script>
